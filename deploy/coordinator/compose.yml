# The StingStream coordinator on a VPS, in Full mode.
#
#   docker compose -f deploy/coordinator/compose.yml up -d
#   docker compose -f deploy/coordinator/compose.yml --profile storage-node up -d
#
# Full mode needs a real delegation: point `direct.<your-domain>` at this host with NS records
# before starting, or the certificates will never validate. See README.md in this directory.
#
# Everything is set through the environment, so this file is also a complete reference for what a
# coordinator can be told. Copy `.env.example` to `.env` and edit that rather than this file.
#
# Pinning: `:latest` moves every time master publishes a new image (coordinator.yml / images.yml).
# For an unattended box, pin `STINGSTREAM_COORDINATOR_TAG`/`STINGSTREAM_NODE_TAG` to a real release
# tag (e.g. `v0.1.0`) in `.env` instead, and update on your own schedule -- see docs/RELEASING.md.

name: stingstream-coordinator

secrets:
  # The storage-node's invite code (see that service's own comment for why this is a file, not a
  # plain env var). Soft default, not `${VAR:?...}`: this section is parsed by every `docker
  # compose` invocation against this file, including one that never touches the storage-node
  # profile at all, and a hard-required variable here would break plain coordinator-only usage for
  # anyone who has not set it. /dev/null always exists on the Linux hosts Full mode runs on, reads
  # as empty, and the node's own joincode::resolve() bails with a clear, specific error at
  # container start if `--profile storage-node` is actually used without pointing this at a real
  # file -- a much better failure than a cryptic compose-parse error for everyone else.
  storage_node_join_code:
    file: ${STORAGE_NODE_JOIN_CODE_FILE:-/dev/null}

services:
  coordinator:
    image: ghcr.io/danpatten/stingstream-coordinator:${STINGSTREAM_COORDINATOR_TAG:-latest}
    # To build from a checkout instead:
    #   build:
    #     context: ../..
    #     dockerfile: deploy/coordinator/Dockerfile
    restart: unless-stopped
    environment:
      STINGSTREAM_COORDINATOR_MODE: full
      # The coordinator's own name. Must resolve to this host and is the SNI value that terminates
      # locally rather than being tunnelled to a node.
      STINGSTREAM_COORDINATOR_HOSTNAME: ${COORDINATOR_HOSTNAME:?set COORDINATOR_HOSTNAME in .env}
      # The zone delegated to this host. Every node's side-door names live under it.
      STINGSTREAM_COORDINATOR_DNS_ORIGIN: direct.${BASE_DOMAIN:?set BASE_DOMAIN in .env}
      # Answered for the zone apex, for `relay.<origin>` and for every `relay.<nodeid>.<origin>` —
      # the last of which is where SNI passthrough lands, so it must be this host's real address.
      STINGSTREAM_COORDINATOR_PUBLIC_IPS: ${PUBLIC_IPS:?set PUBLIC_IPS in .env}
      # The NS names in the delegation, so the zone's own NS and SOA answers are consistent.
      STINGSTREAM_COORDINATOR_NS: ${NS_NAMES:-ns1.${BASE_DOMAIN}}
      # Terminate TLS here (Full mode is not behind a platform proxy). `acme` gets a Let's Encrypt
      # certificate for the hostname above over TLS-ALPN-01 on 443.
      STINGSTREAM_COORDINATOR_TLS: acme
      STINGSTREAM_COORDINATOR_ACME_CONTACT: mailto:${ACME_CONTACT:?set ACME_CONTACT in .env}
      # Start at staging. Flip to `false` once a staging certificate has been issued successfully:
      # Let's Encrypt's production rate limits are unforgiving of a misconfigured first attempt.
      STINGSTREAM_COORDINATOR_ACME_STAGING: ${ACME_STAGING:-true}
      # The SNI router on 443: the coordinator's own name terminates here, `relay.<nodeid>` is
      # tunnelled to that node over iroh, everything else is closed.
      STINGSTREAM_COORDINATOR_SNI: "true"
      STINGSTREAM_COORDINATOR_SNI_BIND: 0.0.0.0:443
      # The relay protocol and the coordinator API share this port. Behind the SNI router in Full
      # mode, so it does not need to be published.
      STINGSTREAM_COORDINATOR_BIND: 0.0.0.0:8080
      STINGSTREAM_COORDINATOR_DNS_BIND: 0.0.0.0:53
      RUST_LOG: ${RUST_LOG:-stingstream_relay=info,iroh_relay=info,warn}
    ports:
      - "443:443/tcp"     # SNI router: the relay protocol, the API and node passthrough
      - "53:53/udp"       # authoritative DNS for direct.<domain>
      - "53:53/tcp"       # ...and its TCP half, for answers that do not fit in a datagram
      - "7842:7842/udp"   # iroh QUIC address discovery
    volumes:
      # The ACME account and certificate cache, and the pkarr signed-packet store. Rendezvous
      # entries and node registrations are deliberately in memory: members refresh well inside the
      # entry TTL, so a restart heals on its own and needs nothing durable.
      - coordinator-data:/data
    healthcheck:
      # The binary answering its own health endpoint over loopback -- the runtime image ships
      # neither curl nor wget. `--healthcheck` (not `--check`, which only validates configuration
      # in a fresh process and never touches the running server, so it cannot catch a coordinator
      # that has hung) actually asks the running process whether it is serving.
      test: ["CMD", "/usr/local/bin/stingstream-relay", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # A full StingStream node joined to a group, so the coordinator host doubles as an always-on
  # seedbox and cache. The image is deploy/node/Dockerfile, published by M8a's images.yml
  # (ghcr.io/danpatten/stingstream-node), and this profile is the "join a group from an env var"
  # path M8a's deliverables call for -- see docs/RUNNING.md if you would rather mint an invite and
  # join over the API by hand instead.
  #
  # Colocating a node with the coordinator on one box is convenient but not free: a runaway
  # transcode or a large import competing for the same CPU/network can starve the relay, DNS and
  # SNI router the rest of the group depends on. See README.md's own warning, and consider the
  # commented resource limits below.
  storage-node:
    profiles: ["storage-node"]
    image: ghcr.io/danpatten/stingstream-node:${STINGSTREAM_NODE_TAG:-latest}
    # on-failure, not unless-stopped: the supervisor exits 0 on a deliberate shutdown (Ctrl+C,
    # `docker stop`'s SIGTERM), and unless-stopped would restart it anyway on that clean exit --
    # matching deploy/linux/systemd/stingstream.service's own Restart=on-failure.
    restart: on-failure
    depends_on:
      # Waits for the coordinator's own healthcheck (--healthcheck above), not just for its
      # container to exist -- joining depends on the coordinator's rendezvous actually answering,
      # not merely having started.
      coordinator:
        condition: service_healthy
    secrets:
      - storage_node_join_code
    environment:
      # A file, not a plain variable: an invite code carries the whole group's secret key
      # material, and a plain `environment:` entry is visible in `docker inspect`, in
      # /proc/<pid>/environ, and in shell history -- see
      # mesh/crates/stingstream/src/joincode.rs's own module doc for the full reasoning behind
      # STINGSTREAM_JOIN_CODE_FILE existing at all. Create the file named by
      # STORAGE_NODE_JOIN_CODE_FILE (chmod 600, containing just the invite code) before starting
      # this profile; the node calls MeshNode::join with it once the mesh is up, idempotently, so
      # leaving it in place across restarts just refreshes membership rather than erroring on an
      # already-joined group.
      STINGSTREAM_JOIN_CODE_FILE: /run/secrets/storage_node_join_code
      STINGSTREAM_MESH_NODE_NAME: ${STORAGE_NODE_NAME:-seedbox}
    # Empty (the default) means the image's own user. Set both to the numeric owner of whatever
    # you bind-mount below (`stat -c '%u:%g' /path/to/your/media`) so the node can actually write
    # to it -- a bind mount keeps the HOST's ownership, which rarely matches the image's own user.
    user: "${STORAGE_NODE_UID:-}:${STORAGE_NODE_GID:-}"
    ports:
      - "8790:8790"
    volumes:
      - storage-node-data:/data
      # Point these at the big disk too, alongside media: downloads and Jellyfin's transcode
      # cache are the other two places this node's real disk usage happens. Defaulted to the same
      # small local-directory pattern as media, not an empty host path -- an empty value on the
      # left of a compose bind mount does not mean "skip this line," it means an invalid mount.
      - ${STORAGE_NODE_MEDIA:-./media}:/data/media
      - ${STORAGE_NODE_DOWNLOADS:-./downloads}:/data/downloads
      - ${STORAGE_NODE_CACHE:-./cache}:/data/jellyfin/cache
    healthcheck:
      test: ["CMD", "/app/bin/stingstream", "--healthcheck", "--data-dir", "/data"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 300s, not 60s: the supervisor's own first-run health grace is about that long and
      # `/healthz` answers 503 until every child is healthy (docs/RUNNING.md) -- three
      # self-contained .NET apps doing first-run database setup, unlike the coordinator's single
      # lightweight Rust binary above. 60s marked a perfectly healthy first-run node as failed
      # around the 150s mark.
      start_period: 300s
    # Uncomment to cap this node's footprint on a box that also runs the coordinator -- see the
    # warning in this service's own header comment and in README.md.
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2.0"
    #       memory: 4G

volumes:
  coordinator-data:
  storage-node-data:

Description: >-
  StingStream replaces the usual five-tool media stack (Jellyfin, Sonarr, Radarr, a remote-management
  app, and a download client) with one install, one UI, and one login. Every member of a group pools
  their libraries and downloads automatically, and playback picks the best available source across
  the group. Installs as a Windows service listening on http://localhost:8790.

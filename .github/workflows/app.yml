# The app's half of M3c: the mesh light node inside `apps/stingstream`.
#
# Deliberately separate from ci.yml, which builds the .NET subtrees and takes the best part of an
# hour, and from coordinator.yml, which is the node half of the mesh. This one is what an app or
# FFI change waits on.
#
#   * `checks` — the app's TypeScript, unit tests and formatter. Minutes.
#   * `ffi`    — the Rust FFI on the host (clippy + tests, including the light-node integration
#                test), then cross-compiled for the three Android ABIs with the Kotlin bindings
#                regenerated and checked for drift against the committed copy.
#
# M5 added a third job that DOES run Gradle:
#
#   * `android-release-unsigned` — builds the actual release APK for both the phone and TV
#     variants, unsigned (no keystore exists in CI by design; docs/APP-RELEASE.md §2 and §10). It
#     downloads `ffi`'s already-cross-compiled .so instead of building the mesh library a second
#     time, which is most of why this can stay a normal push/PR job rather than something reserved
#     for release tags. A *signed* build only ever happens locally
#     (apps/stingstream/scripts/build-release.ps1), against a keystore that is never in this repo
#     or in CI.
#
# Worth being precise about what `android-release-unsigned` still leaves uncovered, because it has
# already cost one bug. The mesh module once crashed the *whole app* at startup by reading
# `appContext` from a property initialiser (docs/APP-MESH.md §9). A Gradle compile — which is all
# this job does — would not have caught it: it compiled perfectly, and failed only when Expo's
# ModuleRegistry actually constructed the module with a JS bundle running. That check is launching
# the app on an emulator, which stays a manual/local step (docs/APP-RELEASE.md §11) rather than a
# CI job — an Android emulator on a hosted runner is slow and flaky enough that a red build there
# would as often mean "the runner" as "the app."
name: app

on:
  push:
    branches: [master]
    paths:
      - "apps/stingstream/**"
      - "mesh/crates/stingstream-mesh-ffi/**"
      - "mesh/crates/stingstream-mesh/**"
      - "mesh/Cargo.toml"
      - "mesh/Cargo.lock"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "apps/stingstream/**"
      - "mesh/crates/stingstream-mesh-ffi/**"
      - "mesh/crates/stingstream-mesh/**"
      - "mesh/Cargo.toml"
      - "mesh/Cargo.lock"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.run_id || '' }}
  # `cancel-in-progress: false` was not enough on its own. A concurrency group admits one run
  # at a time and keeps only the *newest* pending one, so with several agents pushing to master
  # minutes apart the middle commits were cancelled before they ever started -- which looks
  # exactly like a failure and is not evidence of anything. So on master every run gets its own
  # group and neither queues nor cancels; on a branch the ref is the group and a new push
  # supersedes the old run, which is what you want while iterating.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: stingstream_mesh=info,stingstream_mesh_ffi=info,warn

jobs:
  checks:
    name: typescript and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # submodules: true — apps/stingstream/utils/jellyseerr is a real submodule and its imports
      # must resolve for the app to typecheck at all. Same reasoning as ci.yml's `node` job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1

      # `@stingstream/api-client` is a `file:` dependency, and since 973ec6f its `types` point at
      # `src/index.ts` — so TypeScript checks the package's *source*, which imports `openapi-fetch`
      # from `packages/api-client/node_modules`. The app's own install does not populate that, so
      # without this step CI fails with "Cannot find module 'openapi-fetch'" and a knock-on
      # implicit-any wherever the client's return type is used. No build step: only the deps.
      - name: Install the API client's dependencies
        working-directory: packages/api-client
        run: bun install --frozen-lockfile

      - name: Install dependencies
        working-directory: apps/stingstream
        run: bun install --frozen-lockfile

      # Covers the URL rewrite's own suite (utils/mesh/streamUrl.test.ts) along with everything
      # else. The rewrite is the one piece of M3c that runs on every playback, and it is pure, so
      # it is worth having a real test rather than a device to try it on.
      - name: TypeScript
        working-directory: apps/stingstream
        run: bun run typecheck

      - name: Unit tests
        working-directory: apps/stingstream
        run: bun run test:unit

      # `bun run check` is `biome check .` — the whole directory, including `dist/`. That is
      # deliberate locally and fine here because this job never runs `expo export`, so there is no
      # build output for it to walk. Do not add an export step to this job without narrowing it.
      - name: Formatter and lint
        working-directory: apps/stingstream
        run: bun run check

  ffi:
    name: mesh FFI (host + Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # No `lfs: true`: mesh/jellyswarrm/dev/media/** is vendored as LFS pointer text whose objects
      # were never pushed, so an LFS checkout fails. Same reason as ci.yml and coordinator.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch HEAD as of 2026-09-03
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: mesh

      - name: Clippy
        run: >
          cargo clippy --manifest-path mesh/Cargo.toml
          -p stingstream-mesh-ffi --all-targets -- -D warnings

      # 24 unit tests plus `tests/light_node.rs`, which runs a light handle and a full node in one
      # process with every discovery service off: joins by invite, streams a verified mid-file
      # range through the light node's loopback port, and asserts the reverse direction is refused
      # with 403. Needs no network beyond loopback.
      - name: Test on the host
        run: cargo test --manifest-path mesh/Cargo.toml -p stingstream-mesh-ffi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # The runner image ships an NDK; take whichever it has rather than pinning a version this
      # workflow would then have to chase.
      - name: Locate the NDK
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$ndk" ]; then
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "Using NDK at $ndk"

      # `-P`, not `-p`: in cargo-ndk 4.x `-p` is passed through to cargo as `--package`, so `-p 26`
      # fails with "unknown package: 26". API 26 matches the app's minSdkVersion.
      - name: Cross-compile for the three Android ABIs
        working-directory: mesh
        run: >
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 26
          build -p stingstream-mesh-ffi --release

      # The committed Kotlin bindings are what let the Expo module compile without a Rust
      # toolchain (docs/APP-MESH.md §4). They are generated from the library's own symbol table, so
      # a change to the FFI surface that was not regenerated shows up here rather than as an
      # UnsatisfiedLinkError on somebody's phone.
      #
      # Read the unstripped library out of cargo's target directory: uniffi's library mode finds
      # its metadata in the symbol table, and a stripped .so has none.
      - name: Check the generated bindings are in step
        working-directory: mesh
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          cargo run -q -p stingstream-mesh-ffi --bin uniffi-bindgen -- \
            generate --language kotlin --no-format --out-dir "$out" \
            target/x86_64-linux-android/release/libstingstream_mesh_ffi.so
          committed=../apps/stingstream/modules/stingstream-mesh/android/src/main/java/uniffi
          if ! diff -ru "$committed" "$out/uniffi"; then
            echo "::error::The committed uniffi bindings are out of date. Run apps/stingstream/scripts/build-mesh-android.ps1 and commit the result."
            exit 1
          fi
          echo "The committed bindings match the library."

      - name: Report the library sizes
        working-directory: mesh
        run: |
          set -euo pipefail
          strip=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          for triple in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            so=target/$triple/release/libstingstream_mesh_ffi.so
            "$strip" -o "$so.stripped" "$so"
            printf '%-28s %s\n' "$triple" "$(du -h "$so.stripped" | cut -f1)"
          done

      - name: Upload the Android libraries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stingstream-mesh-ffi-android
          path: mesh/target/*-linux-android*/release/libstingstream_mesh_ffi.so.stripped
          if-no-files-found: error
          retention-days: 7

  android-release-unsigned:
    name: android release build (unsigned, ${{ matrix.variant }})
    needs: ffi
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [phone, tv]
    steps:
      # submodules: true — see checks' own comment above; the same jellyseerr submodule import
      # has to resolve here too, for `expo prebuild`/typecheck-adjacent tooling.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      # Same reasoning as `checks`' own identical step: the api-client is a `file:` dependency
      # whose `types` point at its own source, which the app's install does not populate deps for.
      - name: Install the API client's dependencies
        working-directory: packages/api-client
        run: bun install --frozen-lockfile

      - name: Install dependencies
        working-directory: apps/stingstream
        run: bun install --frozen-lockfile

      # `ffi` already cross-compiled these for all three ABIs; building them a second time here
      # would double this workflow's slowest step for no reason. A missing library would otherwise
      # only be a *warning* on assembleRelease's own release-only hard-failure check
      # (modules/stingstream-mesh/android/build.gradle) if the download step below silently found
      # nothing — it does not fail silently, `if-no-files-found: error` on the artifact upload
      # already guarantees these files exist by the time this job runs.
      - name: Download the mesh's Android libraries (built by the ffi job)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stingstream-mesh-ffi-android
          path: mesh-libs

      - name: Place the mesh libraries where the Expo module expects them
        run: |
          set -euo pipefail
          declare -A abi_for_triple=(
            [aarch64-linux-android]=arm64-v8a
            [armv7-linux-androideabi]=armeabi-v7a
            [x86_64-linux-android]=x86_64
          )
          for triple in "${!abi_for_triple[@]}"; do
            abi="${abi_for_triple[$triple]}"
            dest="apps/stingstream/modules/stingstream-mesh/android/src/main/jniLibs/$abi"
            mkdir -p "$dest"
            cp "mesh-libs/$triple/release/libstingstream_mesh_ffi.so.stripped" "$dest/libstingstream_mesh_ffi.so"
          done

      # EXPO_TV picks the variant at prebuild time (docs/APP-DEV.md) — a phone and a TV build
      # cannot share one generated android/ project, which is why this is a matrix rather than one
      # job building both.
      - name: Prebuild (${{ matrix.variant }})
        working-directory: apps/stingstream
        env:
          EXPO_TV: ${{ matrix.variant == 'tv' && '1' || '0' }}
        run: npx expo prebuild --platform android

      # No STINGSTREAM_KEYSTORE_PROPERTIES is set anywhere in this job: plugins/withReleaseSigning.ts
      # then clears the release build type's signingConfig entirely (docs/APP-RELEASE.md §2), so
      # AGP names the output app-release-unsigned.apk rather than app-release.apk — a genuinely
      # unsigned artifact, not a debug-signed stand-in for one.
      - name: gradlew assembleRelease
        working-directory: apps/stingstream/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Find the unsigned APK
        id: apk
        working-directory: apps/stingstream/android/app/build/outputs/apk/release
        # Not `apk=$(ls a b 2>/dev/null | head -1)`: under this script's own `set -eo pipefail`,
        # `ls`'s non-zero exit when NEITHER name exists propagates through the pipe into `head`'s
        # exit status, which fails the assignment and kills the script right here -- before the
        # `if [ -z "$apk" ]` diagnostic below ever runs. Found for real: the TV leg's build
        # succeeded (`BUILD SUCCESSFUL`) and this step still died with exit code 2 and no
        # "::error::" line and no `ls -la` at all, which is the signature of this exact footgun
        # (docs/RELEASING.md's own "set -e footgun" section documents the sibling case). `[ -f ]`
        # as a plain `if` condition is exempt from `errexit` by construction, so this can never
        # again swallow its own error message.
        run: |
          set -euo pipefail
          apk=""
          for candidate in app-release-unsigned.apk app-release.apk; do
            if [ -f "$candidate" ]; then
              apk="$candidate"
              break
            fi
          done
          if [ -z "$apk" ]; then
            echo "::error::No release APK found in $(pwd)"
            ls -la
            exit 1
          fi
          echo "path=$(pwd)/$apk" >> "$GITHUB_OUTPUT"

      - name: Upload the unsigned APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stingstream-${{ matrix.variant }}-release-unsigned
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7

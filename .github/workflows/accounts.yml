# The account service image (`stingstream-accounts`).
#
# Its own workflow, and deliberately not part of coordinator.yml or images.yml. The account service
# is a *second* Railway service holding completely different data with a completely different blast
# radius: the coordinator holds nothing and can be redeployed at will, this one holds every account
# and needs a volume. Sharing a workflow would also share a concurrency group, so an unrelated
# coordinator change could queue behind or race a change to the front door everybody signs in
# through.
#
# Built with `--features passkeys`, which the Dockerfile does: `webauthn-rs` reaches OpenSSL, so the
# default build everywhere else is OpenSSL-free and this is the one place the full service exists.
# ci.yml separately runs `cargo check --features passkeys`, which is faster and catches a compile
# error before this job spends ten minutes proving the same thing.
name: Accounts

on:
  push:
    branches: [master]
    paths:
      - "mesh/crates/stingstream-accounts/**"
      - "mesh/crates/stingstream-token/**"
      - "mesh/Cargo.toml"
      - "mesh/Cargo.lock"
      - "deploy/accounts/**"
      - ".github/workflows/accounts.yml"
  pull_request:
    paths:
      - "mesh/crates/stingstream-accounts/**"
      - "mesh/crates/stingstream-token/**"
      - "mesh/Cargo.toml"
      - "mesh/Cargo.lock"
      - "deploy/accounts/**"
      - ".github/workflows/accounts.yml"
  workflow_dispatch:

concurrency:
  # Same shape and same reasoning as coordinator.yml: on master every run gets its own group, so
  # several commits minutes apart do not cancel each other and look like failures; on a branch the
  # ref is the group and a new push supersedes the old run.
  group: accounts-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.run_id || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  image:
    name: accounts image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Only master publishes. A pull request still builds the image, which is the half of this job
      # that catches a broken Dockerfile.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `http.rs`'s `short_commit()` truncates to 7 characters the same way; computed once here so
      # both the real build's `build-args` and the smoke test's assertion agree with each other and
      # with what a live service will report.
      - name: Compute the short commit SHA
        id: short_sha
        run: echo "value=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/accounts/Dockerfile
          push: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
          # Lowercase on purpose: GHCR rejects an uppercase path, and the owner is `DanPatten`.
          tags: |
            ghcr.io/danpatten/stingstream-accounts:${{ github.sha }}
            ghcr.io/danpatten/stingstream-accounts:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # A built image that cannot answer /healthz is not a passing build. Two of the three
      # assertions below are about things that are invisible from outside and expensive to get
      # wrong: that this image really did compile the passkeys feature (a Dockerfile that quietly
      # lost the flag would deploy a service whose passkey routes all answer 501, and look fine),
      # and that the commit it reports is the commit that built it (which is what makes a Railway
      # auto-deploy provable rather than assumed).
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker build -f deploy/accounts/Dockerfile --build-arg GIT_SHA=${{ github.sha }} -t accounts-smoke .
          docker run -d --name accounts-smoke -p 18081:8080 \
            -e STINGSTREAM_ACCOUNTS_DATA=/data \
            -e STINGSTREAM_ACCOUNTS_ORIGIN=https://accounts.smoke.invalid \
            accounts-smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/healthz > /tmp/healthz.json; then break; fi
            sleep 1
          done
          cat /tmp/healthz.json
          grep -q '"ok":true' /tmp/healthz.json
          grep -q '"service":"stingstream-accounts"' /tmp/healthz.json
          grep -q '"passkeys_built":true' /tmp/healthz.json
          grep -q "\"commit\":\"${SHORT_SHA}\"" /tmp/healthz.json
          # And the feature is not merely compiled in but actually usable, which needs the origin
          # above to have been accepted as a relying party.
          curl -fsS http://127.0.0.1:18081/accounts/v1/passkeys > /tmp/passkeys.json
          cat /tmp/passkeys.json
          grep -q '"supported":true' /tmp/passkeys.json
          docker logs accounts-smoke
          docker rm -f accounts-smoke
        env:
          SHORT_SHA: ${{ steps.short_sha.outputs.value }}

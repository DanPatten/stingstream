# The M8a release pipeline: on a `v*` tag, build every packaging target this milestone produces,
# checksum them, and publish a GitHub Release. Also runnable via workflow_dispatch for a dry run
# on master without a tag -- see docs/RELEASING.md "Doing a release" for the exact steps and what
# a dry run does and does not prove.
#
# Jobs:
#   * `version`            -- resolves the version string from the tag (or the dispatch input).
#   * `windows-installer`  -- windows-latest: tools/package-node.ps1 -Rid win-x64, then
#                              deploy/windows/build-installer.ps1 (Inno Setup).
#   * `linux-packages`     -- ubuntu-latest, matrix [linux-x64, linux-arm64]: tools/package-node.sh,
#                              nfpm for the .deb, appimagetool for the AppImage. The linux-x64 leg
#                              additionally installs its own .deb on the runner (a real Ubuntu VM
#                              with real systemd -- see that job's own comment) and checks the
#                              service actually starts.
#   * `macos`               -- both legs on macos-14 (Apple Silicon): real Mac hardware, so this
#                              actually builds and smoke-tests the binary, unlike anything possible
#                              on Dan's own machine. osx-x64 is cross-compiled here (rustup target
#                              x86_64-apple-darwin; .NET's self-contained publish cross-publishes
#                              for any RID regardless of host) and smoke-tested under Rosetta 2,
#                              rather than natively -- GitHub retired the macos-13 (Intel) hosted
#                              runner image in question during 2025 (github.blog/changelog/
#                              2025-09-19-github-actions-macos-13-runner-image-is-closing-down),
#                              which is what actually broke the v0.1.0-rc1 release run: the
#                              osx-x64 job queued for over an hour against a runner label GitHub no
#                              longer schedules, and never got a chance to fail loudly. Unsigned,
#                              unnotarized -- see docs/INSTALL.md "macOS" for exactly what that
#                              means for a user.
#   * `android-unsigned`    -- best-effort, no rebuild: downloads the unsigned APKs app.yml's own
#                              `android-release-unsigned` job already produces, if a run exists
#                              for this commit (or, failing that, the most recent one on master).
#                              Signing stays local per docs/APP-RELEASE.md regardless of this job.
#   * `release`             -- gathers every artifact, computes SHA256SUMS and version.json
#                              (tools/generate-version-json.sh), retags the node image
#                              (ghcr.io/danpatten/stingstream-node) with the release version, and
#                              creates the GitHub Release.
#
# Versioning: 0.<milestone>.<n> until 1.0 (docs/RELEASING.md). A tag is the only thing that makes
# this a real, numbered release; workflow_dispatch is for proving the pipeline works.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to build, without a leading "v" (e.g. 0.8.0). Required for a manual dry run --
          there is no tag to read it from. Does not create a GitHub Release; see the `release`
          job's own `if:`.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # One release build at a time full stop -- unlike ci.yml/coordinator.yml's per-push groups,
  # there is no "several people pushing to master minutes apart" scenario for a release tag, and
  # two releases racing to create GitHub Releases or retag the same image is worth serializing
  # against even if it means one waits.
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_tag: ${{ steps.v.outputs.is_tag }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            v="${GITHUB_REF_NAME#v}"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            v="${{ inputs.version }}"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -z "$v" ]]; then
            echo "::error::No version resolved. Push a vX.Y.Z tag, or pass 'version' for workflow_dispatch."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

  windows-installer:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # third_party/*/fetch-*.ps1 use this to authenticate to api.github.com -- anonymous
      # requests share a 60/hour rate limit across every GitHub Actions runner's IP range,
      # which several concurrent workflows across this repo exhaust quickly; found failing
      # for real, not hypothetical (a jellyfin-ffmpeg fetch hit "API rate limit exceeded"
      # mid-run while proving this workflow out).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Points dotnet's own restore cache at a workspace-relative path so the "Cache NuGet
      # packages" step below actually caches what gets populated -- tools/package-node.ps1/.sh
      # already honour a pre-set NUGET_PACKAGES rather than falling back to
      # ~/.nuget/packages (see their own -NuGetPackagesFallback / $NUGET_PACKAGES handling).
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      # submodules: true -- apps/stingstream/utils/jellyseerr is a real submodule and its
      # imports must resolve for bun run build:web below to bundle at all (same reasoning as
      # ci.yml's node job and app.yml's checks/android-release-unsigned jobs).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch HEAD as of 2026-09-03

      # `key: win-x64` is redundant while this job has no matrix (there is only one RID here), but
      # keeps the same shape as linux-packages'/macos' own rust-cache step below, where the target
      # triple in the key is load-bearing (see that step's own comment).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: mesh
          key: win-x64
          cache-on-failure: true

      # Same three bands as ci.yml's own dotnet job: Radarr pins 8.0, Jellyfin and Sonarr pin 10.0.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # NuGet packages restored by tools/package-node.ps1's own `dotnet publish`/`dotnet msbuild`
      # calls below. Keyed on the project files that determine what gets restored, plus the RID
      # (Jellyfin/Radarr/Sonarr's self-contained publish pulls in RID-specific runtime packages a
      # different RID's cache would not satisfy) -- restore-keys still gives a partial hit if only
      # the RID changes and the dependency set itself did not.
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-win-x64-${{ hashFiles('server/jellyfin/global.json', 'server/radarr/global.json', 'server/sonarr/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-win-x64-
            nuget-${{ runner.os }}-

      # Cached keyed on the resolved release tag, not "latest": the tag is what determines the
      # downloaded bytes, so a cache hit skips the download outright. -PrintVersionOnly makes one
      # lightweight API call to resolve it; the real fetch below pins to that same tag with -Tag
      # rather than re-querying "latest" a second time.
      - name: Resolve jellyfin-ffmpeg version
        id: ffmpeg_version
        run: pwsh third_party/ffmpeg/fetch-jellyfin-ffmpeg.ps1 -PrintVersionOnly

      - name: Cache jellyfin-ffmpeg
        id: cache_ffmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/ffmpeg/bin/win64
          key: jellyfin-ffmpeg-${{ steps.ffmpeg_version.outputs.tag }}-win64

      - name: Fetch jellyfin-ffmpeg (win64)
        if: steps.cache_ffmpeg.outputs.cache-hit != 'true'
        run: pwsh third_party/ffmpeg/fetch-jellyfin-ffmpeg.ps1 -Platform win64 -Tag ${{ steps.ffmpeg_version.outputs.tag }}

      - name: Resolve nzbget version
        id: nzbget_version
        run: pwsh third_party/nzbget/fetch-nzbget.ps1 -PrintVersionOnly

      - name: Cache nzbget
        id: cache_nzbget
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/nzbget/bin/win64
          key: nzbget-${{ steps.nzbget_version.outputs.tag }}-win64

      - name: Fetch nzbget (win64)
        if: steps.cache_nzbget.outputs.cache-hit != 'true'
        run: pwsh third_party/nzbget/fetch-nzbget.ps1 -Platform win64 -Tag ${{ steps.nzbget_version.outputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1

      # bun has no built-in cache action like actions/setup-node's `cache: npm` -- this caches
      # bun's own download cache (not node_modules, which `--frozen-lockfile` still reconstructs
      # every run) so a cache hit skips re-downloading every package bun.lock pins.
      - name: Cache bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install the API client's dependencies
        working-directory: packages/api-client
        run: bun install --frozen-lockfile
      - name: Build the web bundle
        working-directory: apps/stingstream
        run: |
          bun install --frozen-lockfile
          bun run build:web

      # -Parallel: windows-latest runners have several cores sitting idle while one `dotnet
      # publish` waits on MSBuild/NuGet -- see tools/package-node.ps1's own -Parallel doc comment
      # for why this is safe to turn on unconditionally here (a hosted CI runner, unlike a
      # developer's own machine, has nothing else contending for those cores or for MSBuild node
      # reuse).
      - name: Package the win-x64 node
        run: pwsh tools/package-node.ps1 -Rid win-x64 -Version "${{ needs.version.outputs.version }}" -Parallel

      - name: Install Inno Setup
        # GitHub's windows-latest runner image ships Inno Setup preinstalled already (see
        # actions/runner-images' own Windows2022-Readme.md / Windows2025-Readme.md "Tools" section:
        # "InnoSetup 6.7.1", verified against both current windows-latest images) -- the cheapest
        # possible cache is not re-installing it at all. deploy/windows/build-installer.ps1 already
        # searches PATH and these same two install locations before giving up, so this reuses its
        # own detection rather than inventing a second copy of it. winget on a fresh runner
        # occasionally needs its source re-indexed before the first real install of a session
        # succeeds; Chocolatey (also preinstalled on windows-latest) is the fallback rather than a
        # retry loop against the same flaky source -- kept as a safety net for if a future runner
        # image ever drops or relocates Inno Setup.
        shell: pwsh
        run: |
          $isccPath = $null
          $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if ($cmd) { $isccPath = $cmd.Source }
          if (-not $isccPath) {
            foreach ($candidate in @(
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            )) {
              if (Test-Path $candidate) { $isccPath = $candidate; break }
            }
          }
          if ($isccPath) {
            Write-Host "Inno Setup already present at $isccPath -- skipping install."
          } else {
            winget install --id JRSoftware.InnoSetup -e --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
            if ($LASTEXITCODE -ne 0) {
              Write-Host "winget install failed (exit $LASTEXITCODE); falling back to choco"
              choco install innosetup -y --no-progress
            }
          }

      - name: Build the installer
        run: pwsh deploy/windows/build-installer.ps1 -SkipPackage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: dist/installers/StingStream-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

  linux-packages:
    name: Linux packages (${{ matrix.rid }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # third_party/*/fetch-*.ps1 use this to authenticate to api.github.com -- anonymous
      # requests share a 60/hour rate limit across every GitHub Actions runner's IP range,
      # which several concurrent workflows across this repo exhaust quickly; found failing
      # for real, not hypothetical (a jellyfin-ffmpeg fetch hit "API rate limit exceeded"
      # mid-run while proving this workflow out).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Points dotnet's own restore cache at a workspace-relative path so the "Cache NuGet
      # packages" step below actually caches what gets populated -- tools/package-node.ps1/.sh
      # already honour a pre-set NUGET_PACKAGES rather than falling back to
      # ~/.nuget/packages (see their own -NuGetPackagesFallback / $NUGET_PACKAGES handling).
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            deb_arch: amd64
            appimage_arch: x86_64
          - rid: linux-arm64
            deb_arch: arm64
            appimage_arch: aarch64
    steps:
      # submodules: true -- apps/stingstream/utils/jellyseerr is a real submodule and its
      # imports must resolve for bun run build:web below to bundle at all (same reasoning as
      # ci.yml's node job and app.yml's checks/android-release-unsigned jobs).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch HEAD as of 2026-09-03
        with:
          targets: ${{ matrix.rid == 'linux-arm64' && 'aarch64-unknown-linux-gnu' || '' }}

      - name: Install the aarch64 cross-linker
        if: matrix.rid == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # `key: matrix.rid` is load-bearing here, not decorative: both legs run on the same
      # `ubuntu-latest` runner, and Swatinem/rust-cache's default key does not otherwise
      # distinguish a native x86_64 `target/release` from a cross-compiled
      # `target/aarch64-unknown-linux-gnu/release` -- without it the two legs would take turns
      # evicting each other's `mesh/target`, so every run would look like a cold cache for
      # whichever leg happened to run second.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: mesh
          key: ${{ matrix.rid }}
          cache-on-failure: true

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # Same reasoning as windows-installer's own NuGet cache step; keyed additionally on the RID
      # for the same reason the rust-cache step above is.
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('server/jellyfin/global.json', 'server/radarr/global.json', 'server/sonarr/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.rid }}-
            nuget-${{ runner.os }}-

      # Same cache-by-resolved-tag pattern as windows-installer's own fetch steps; see there.
      - name: Resolve jellyfin-ffmpeg version
        id: ffmpeg_version
        run: pwsh third_party/ffmpeg/fetch-jellyfin-ffmpeg.ps1 -PrintVersionOnly

      - name: Cache jellyfin-ffmpeg
        id: cache_ffmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/ffmpeg/bin/${{ matrix.rid == 'linux-arm64' && 'linuxarm64' || 'linux64' }}
          key: jellyfin-ffmpeg-${{ steps.ffmpeg_version.outputs.tag }}-${{ matrix.rid == 'linux-arm64' && 'linuxarm64' || 'linux64' }}

      - name: Fetch jellyfin-ffmpeg
        if: steps.cache_ffmpeg.outputs.cache-hit != 'true'
        run: pwsh third_party/ffmpeg/fetch-jellyfin-ffmpeg.ps1 -Platform ${{ matrix.rid == 'linux-arm64' && 'linuxarm64' || 'linux64' }} -Tag ${{ steps.ffmpeg_version.outputs.tag }}

      - name: Resolve nzbget version
        id: nzbget_version
        if: matrix.rid == 'linux-x64'
        run: pwsh third_party/nzbget/fetch-nzbget.ps1 -PrintVersionOnly

      - name: Cache nzbget
        id: cache_nzbget
        if: matrix.rid == 'linux-x64'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/nzbget/bin/linux-x64
          key: nzbget-${{ steps.nzbget_version.outputs.tag }}-linux-x64

      - name: Fetch nzbget
        # No linux-arm64 asset upstream -- see deploy/node/LAYOUT.md. package-node.sh already
        # handles the resulting missing bin/nzbget gracefully.
        if: matrix.rid == 'linux-x64' && steps.cache_nzbget.outputs.cache-hit != 'true'
        run: pwsh third_party/nzbget/fetch-nzbget.ps1 -Platform linux-x64 -Tag ${{ steps.nzbget_version.outputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1

      # bun has no built-in cache action like actions/setup-node's `cache: npm` -- this caches
      # bun's own download cache (not node_modules, which `--frozen-lockfile` still reconstructs
      # every run) so a cache hit skips re-downloading every package bun.lock pins.
      - name: Cache bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install the API client's dependencies
        working-directory: packages/api-client
        run: bun install --frozen-lockfile
      - name: Build the web bundle
        working-directory: apps/stingstream
        run: |
          bun install --frozen-lockfile
          bun run build:web

      - name: Package the node
        run: tools/package-node.sh --rid ${{ matrix.rid }} --version "${{ needs.version.outputs.version }}"

      - name: Install nfpm
        # nfpm has no install.sh (found for real: goreleaser/nfpm has never had one at this path --
        # `curl -sfL .../install.sh | sh` 404'd, and piping a 404 into `sh` with no `pipefail` is a
        # silent no-op, not a build failure, so this went unnoticed until the next step's `nfpm:
        # command not found`). Downloads the .deb directly instead, with `curl -f` so a bad URL
        # fails loudly here rather than silently downstream.
        run: |
          set -euo pipefail
          nfpm_version=$(curl -fsSL https://api.github.com/repos/goreleaser/nfpm/releases/latest | \
            python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          curl -fsSL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${nfpm_version}/nfpm_${nfpm_version}_amd64.deb"
          sudo apt-get install -y /tmp/nfpm.deb
          nfpm --version
          # gettext-base (envsubst) is normally already on the ubuntu-latest image; installed
          # explicitly rather than assumed, since deploy/linux/nfpm.yaml's own values depend on it.
          if ! command -v envsubst > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y gettext-base
          fi

      - name: Build the .deb
        env:
          STINGSTREAM_VERSION: ${{ needs.version.outputs.version }}
          STINGSTREAM_ARCH: ${{ matrix.deb_arch }}
          STINGSTREAM_RID: ${{ matrix.rid }}
        # nfpm does not expand ${VAR} in its own config file -- verified empirically, see
        # deploy/linux/nfpm.yaml's own header comment -- so it has to be rendered through envsubst
        # first, and run from the repo root: every relative `src` in that file resolves against
        # nfpm's cwd at invocation time, not against the config file's own location.
        run: |
          set -euo pipefail
          mkdir -p dist/installers
          envsubst '${STINGSTREAM_VERSION} ${STINGSTREAM_ARCH} ${STINGSTREAM_RID}' \
            < deploy/linux/nfpm.yaml > /tmp/nfpm-rendered.yaml
          nfpm package --config /tmp/nfpm-rendered.yaml --target dist/installers/ --packager deb

      - name: Build the AppImage
        run: |
          chmod +x deploy/linux/appimage/build-appimage.sh
          deploy/linux/appimage/build-appimage.sh --rid ${{ matrix.rid }} --version "${{ needs.version.outputs.version }}"

      # GitHub-hosted ubuntu-latest runners are real Ubuntu VMs with a real systemd as PID 1 --
      # not a container -- so installing the .deb here and checking `systemctl status` /
      # `/healthz` is a genuine test of the postinst + unit file, not an emulation of one. Only
      # done for linux-x64: linux-arm64's package cannot actually execute on this runner's CPU,
      # and QEMU-emulating a full Jellyfin+Radarr+Sonarr+NZBGet boot for a CI smoke test is not a
      # good trade against the time it costs -- that leg is verified by successfully building and
      # by depending on the exact same postinst/systemd unit the x64 leg does exercise.
      - name: Verify the .deb installs and the service starts
        if: matrix.rid == 'linux-x64'
        run: |
          set -euo pipefail
          deb=$(readlink -f "$(ls dist/installers/*_amd64.deb | head -1)")
          echo "Installing $deb"
          sudo apt-get update
          # A bare relative path with no leading "./" is parsed by apt-get as a *package name*
          # lookup, not a local file, regardless of whether it contains slashes -- found for real:
          # "E: Unable to locate package dist/installers" (apt truncating at the first slash it
          # did not expect). An absolute path (readlink -f above) sidesteps the ambiguity entirely.
          sudo apt-get install -y "$deb"

          echo "-- systemctl status --"
          sudo systemctl status stingstream.service --no-pager || true

          ok=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/healthz.json -w '%{http_code}' http://127.0.0.1:8790/healthz || echo 000)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then ok=1; break; fi
            sleep 2
          done
          echo "-- /healthz --"
          cat /tmp/healthz.json || true
          echo
          sudo journalctl -u stingstream --no-pager | tail -150
          if [ "$ok" -ne 1 ]; then
            echo "::error::stingstream.service never answered on :8790 after install"
            exit 1
          fi

          echo "-- verifying uninstall leaves /var/lib/stingstream in place --"
          sudo systemctl stop stingstream.service || true
          sudo apt-get remove -y stingstream
          test -d /var/lib/stingstream || { echo "::error::uninstall removed the data directory -- it must not"; exit 1; }
          echo "OK: /var/lib/stingstream survived removal, as documented in docs/INSTALL.md"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-packages-${{ matrix.rid }}
          path: |
            dist/installers/*.deb
            dist/installers/*.AppImage
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS (${{ matrix.rid }}, unsigned)
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # third_party/*/fetch-*.ps1 use this to authenticate to api.github.com -- anonymous
      # requests share a 60/hour rate limit across every GitHub Actions runner's IP range,
      # which several concurrent workflows across this repo exhaust quickly; found failing
      # for real, not hypothetical (a jellyfin-ffmpeg fetch hit "API rate limit exceeded"
      # mid-run while proving this workflow out).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Points dotnet's own restore cache at a workspace-relative path so the "Cache NuGet
      # packages" step below actually caches what gets populated -- tools/package-node.ps1/.sh
      # already honour a pre-set NUGET_PACKAGES rather than falling back to
      # ~/.nuget/packages (see their own -NuGetPackagesFallback / $NUGET_PACKAGES handling).
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rid: osx-arm64
          # Also macos-14, not macos-13: GitHub retired the macos-13 (Intel) hosted runner image
          # during 2025 (github.blog/changelog/2025-09-19-github-actions-macos-13-runner-image-is-
          # closing-down), so a job pinned to it no longer gets scheduled at all -- it just queues
          # forever, which is what actually happened to v0.1.0-rc1's release run (over an hour
          # queued, never started, this job's own 90-minute timeout-minutes never began counting
          # because that budget only covers a *running* job, not time spent queued waiting for a
          # runner). osx-x64 is cross-compiled on Apple Silicon instead -- see the steps below --
          # and smoke-tested under Rosetta 2 rather than on native Intel silicon.
          - os: macos-14
            rid: osx-x64
    steps:
      # submodules: true -- apps/stingstream/utils/jellyseerr is a real submodule and its
      # imports must resolve for bun run build:web below to bundle at all (same reasoning as
      # ci.yml's node job and app.yml's checks/android-release-unsigned jobs).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch HEAD as of 2026-09-03

      # Only osx-x64 needs this: dtolnay/rust-toolchain installs the host's own target
      # (aarch64-apple-darwin) by default, and tools/package-node.sh already knows how to add
      # `--target x86_64-apple-darwin` to its own `cargo build` when it detects a non-native RID
      # (its `RUST_NATIVE` check) -- it just needs the target itself to already be installed.
      - name: Add the x86_64-apple-darwin Rust target (osx-x64 cross-build)
        if: matrix.rid == 'osx-x64'
        run: rustup target add x86_64-apple-darwin

      # `key: matrix.rid` for the same reason as linux-packages' own rust-cache step: both legs
      # run on the same `macos-14` runner, and without a per-RID key osx-arm64's native
      # `target/release` and osx-x64's cross-compiled `target/x86_64-apple-darwin/release` would
      # take turns evicting each other.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: mesh
          key: ${{ matrix.rid }}
          cache-on-failure: true

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # Same reasoning as windows-installer's/linux-packages' own NuGet cache step.
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('server/jellyfin/global.json', 'server/radarr/global.json', 'server/sonarr/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.rid }}-
            nuget-${{ runner.os }}-

      # One asset either way: jellyfin-ffmpeg and nzbget both publish a single universal (multi-
      # arch) macOS binary -- third_party/*/fetch-*.ps1's own PlatformPatterns has exactly one
      # 'macos' entry, not one per architecture -- so this needs no RID-specific selection for
      # either leg.
      # Same cache-by-resolved-tag pattern as windows-installer's own fetch steps; see there. Both
      # matrix legs (osx-arm64, osx-x64) fetch the same single universal 'macos' asset -- see this
      # job's own header comment -- so they share one cache key and only the leg that happens to
      # run first actually downloads anything.
      - name: Resolve jellyfin-ffmpeg version
        id: ffmpeg_version
        run: pwsh third_party/ffmpeg/fetch-jellyfin-ffmpeg.ps1 -PrintVersionOnly

      - name: Cache jellyfin-ffmpeg
        id: cache_ffmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/ffmpeg/bin/macos
          key: jellyfin-ffmpeg-${{ steps.ffmpeg_version.outputs.tag }}-macos

      - name: Fetch jellyfin-ffmpeg (macos)
        if: steps.cache_ffmpeg.outputs.cache-hit != 'true'
        run: pwsh third_party/ffmpeg/fetch-jellyfin-ffmpeg.ps1 -Platform macos -Tag ${{ steps.ffmpeg_version.outputs.tag }}

      - name: Resolve nzbget version
        id: nzbget_version
        run: pwsh third_party/nzbget/fetch-nzbget.ps1 -PrintVersionOnly

      - name: Cache nzbget
        id: cache_nzbget
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/nzbget/bin/macos
          key: nzbget-${{ steps.nzbget_version.outputs.tag }}-macos

      - name: Fetch nzbget (macos)
        if: steps.cache_nzbget.outputs.cache-hit != 'true'
        run: pwsh third_party/nzbget/fetch-nzbget.ps1 -Platform macos -Tag ${{ steps.nzbget_version.outputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1

      # bun has no built-in cache action like actions/setup-node's `cache: npm` -- this caches
      # bun's own download cache (not node_modules, which `--frozen-lockfile` still reconstructs
      # every run) so a cache hit skips re-downloading every package bun.lock pins.
      - name: Cache bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install the API client's dependencies
        working-directory: packages/api-client
        run: bun install --frozen-lockfile
      - name: Build the web bundle
        working-directory: apps/stingstream
        run: |
          bun install --frozen-lockfile
          bun run build:web

      - name: Package the node
        run: bash tools/package-node.sh --rid ${{ matrix.rid }} --version "${{ needs.version.outputs.version }}"

      # GitHub's Apple Silicon runner images ship Rosetta 2 already, but installing is idempotent
      # and near-instant when it is -- cheap insurance against the osx-x64 smoke test below failing
      # with an opaque "Bad CPU type in executable" instead of a clear step name.
      - name: Ensure Rosetta 2 is available (osx-x64 runs under emulation on this arm64 runner)
        if: matrix.rid == 'osx-x64'
        run: softwareupdate --install-rosetta --agree-to-license

      # Real Mac hardware, unlike anywhere else in this project (docs/INSTALL.md) -- so this is a
      # genuine (if partial) proof the binary runs on macOS, not just that it cross-compiles.
      # osx-arm64 runs natively; osx-x64 runs under Rosetta 2 on the same Apple Silicon runner
      # (see the matrix comment above for why it is no longer built on real Intel silicon).
      # --print-runtime resolves config and exits without starting any child, which is what a
      # locally-built, non-quarantined binary can do here without hitting Gatekeeper at all; a
      # downloaded release tarball is a different story -- see docs/INSTALL.md for what that means
      # for an actual user, and why the full multi-child boot stays unverified.
      - name: Smoke-test the built binary
        run: |
          set -euo pipefail
          chmod +x "dist/node/${{ matrix.rid }}/bin/stingstream"
          "dist/node/${{ matrix.rid }}/bin/stingstream" --version
          "dist/node/${{ matrix.rid }}/bin/stingstream" \
            --install-root "dist/node/${{ matrix.rid }}" \
            --data-dir "$RUNNER_TEMP/stingstream-data" \
            --print-runtime | tee "$RUNNER_TEMP/runtime.json"
          grep -q '"node_id"' "$RUNNER_TEMP/runtime.json"

      - name: Tarball
        run: |
          mkdir -p dist/installers
          tar -czf "dist/installers/StingStream-${{ needs.version.outputs.version }}-${{ matrix.rid }}.tar.gz" \
            -C "dist/node/${{ matrix.rid }}" .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.rid }}
          path: dist/installers/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  android-unsigned:
    name: Android (unsigned, reused from app.yml)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true # a release must not fail just because Android artifacts are stale/missing
    steps:
      - name: Find a successful app.yml run to reuse
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "${{ github.repository }}" --workflow=app.yml \
            --commit "${{ github.sha }}" --status success --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo "No app.yml run for this exact commit; falling back to the most recent successful run on master."
            run_id=$(gh run list --repo "${{ github.repository }}" --workflow=app.yml \
              --branch master --status success --json databaseId --jq '.[0].databaseId // empty')
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          if [[ -z "$run_id" ]]; then
            echo "::warning::No successful app.yml run found at all -- this release will ship with no Android artifacts."
          else
            echo "Reusing app.yml run $run_id"
          fi

      - name: Download the unsigned APKs
        if: steps.find.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/android
          gh run download "${{ steps.find.outputs.run_id }}" --repo "${{ github.repository }}" \
            -n stingstream-phone-release-unsigned -D dist/android || true
          gh run download "${{ steps.find.outputs.run_id }}" --repo "${{ github.repository }}" \
            -n stingstream-tv-release-unsigned -D dist/android || true
          # Normalize whatever gradle named the APK (app-release-unsigned.apk / app-release.apk)
          # into the names tools/generate-version-json.sh looks for.
          phone=$(find dist/android -path '*phone*' -name '*.apk' | head -1)
          tv=$(find dist/android -path '*tv*' -name '*.apk' | head -1)
          # if/fi, not `[[ ... ]] &&` -- under `set -e`, a bare `cond && cmd` statement whose
          # condition is false exits the whole script with the condition's own failure status.
          # Found failing for real: no app.yml artifact matched (a stale/expired run), so both
          # conditions were false, and the step died here instead of finishing gracefully into the
          # empty-output case this job's `continue-on-error` and upload-artifact `if-no-files-found:
          # warn` are designed to tolerate.
          if [[ -n "$phone" ]]; then cp "$phone" "dist/android/stingstream-phone-${{ needs.version.outputs.version }}-unsigned.apk"; fi
          if [[ -n "$tv" ]]; then cp "$tv" "dist/android/stingstream-tv-${{ needs.version.outputs.version }}-unsigned.apk"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.find.outputs.run_id != ''
        with:
          name: android-unsigned
          path: dist/android/stingstream-*-unsigned.apk
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Publish the release
    needs: [version, windows-installer, linux-packages, macos, android-unsigned]
    # Android is best-effort (continue-on-error above); Windows, Linux and macOS are not -- a
    # release missing one of those is not the release this milestone promises.
    if: |
      always() &&
      needs.windows-installer.result == 'success' &&
      needs.linux-packages.result == 'success' &&
      needs.macos.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/collected

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p dist/final
          find dist/collected -type f \( \
            -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.apk' \
          \) -exec cp {} dist/final/ \;
          ls -la dist/final

      # A hyphenated version (an -rc tag, e.g. 0.1.0-rc2) comes out of nfpm/deploy/linux/nfpm.yaml
      # with the hyphen turned into `~` -- ordinary Debian version-string handling, documented in
      # that file's own header -- but GitHub's release-asset upload silently renames `~` to `.` in
      # the uploaded filename. Left alone, SHA256SUMS (computed below, from what is on disk right
      # now) lists a filename that does not match what a downloader actually gets from the release
      # page, and the next step's version.json lookup misses both .deb entries with no warning.
      # Renaming here, before SHA256SUMS is computed, means every downstream step (SHA256SUMS,
      # version.json, the actual GitHub Release upload) agrees on one name that survives the
      # upload unchanged.
      - name: Normalize ~ to . in .deb filenames (GitHub renames ~ on upload; nfpm produces it for a hyphenated version)
        working-directory: dist/final
        run: |
          set -euo pipefail
          for f in *.deb; do
            [ -e "$f" ] || continue
            case "$f" in
              *~*)
                new="${f//\~/.}"
                echo "Renaming $f -> $new"
                mv -- "$f" "$new"
                ;;
            esac
          done

      - name: Compute SHA256SUMS
        working-directory: dist/final
        run: sha256sum * > SHA256SUMS

      - name: Generate version.json
        run: |
          chmod +x tools/generate-version-json.sh
          tools/generate-version-json.sh \
            --version "${{ needs.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --artifacts-dir dist/final \
            --out dist/final/version.json

      # Only a real tag push creates a Release; a workflow_dispatch dry run stops here, having
      # already proven every build+package+verify step above.
      - name: Create the GitHub Release
        if: needs.version.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: StingStream v${{ needs.version.outputs.version }}
          generate_release_notes: true
          # Any tag with a hyphen (v0.1.0-rc2, v0.1.0-beta1, ...) is a pre-release build, not the
          # thing docs/RELEASING.md's "Doing a release" tells someone to download -- found for real:
          # v0.1.0-rc2 published with isPrerelease=false, which both marks it as a stable release on
          # the releases page and (via make_latest's own default) makes it a candidate for GitHub's
          # "latest" resolution, exactly the URL the update check and docs/INSTALL.md point at.
          # `contains(github.ref_name, '-')` is safe specifically because this step only runs on a
          # real tag push (the `if:` above) -- github.ref_name is then the tag itself (e.g.
          # "v0.1.0-rc2"), never a branch name a workflow_dispatch run would otherwise put there.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Belt-and-suspenders alongside `prerelease` above: explicit here rather than relying on
          # GitHub's own default "latest" heuristic, so a pre-release tag can never become the
          # release `.../releases/latest/download/version.json` resolves to -- the exact URL
          # docs/RELEASING.md's "The update check" section and the node's own update-check task
          # (mesh/crates/stingstream/src/updatecheck.rs) depend on meaning "the latest *stable*
          # release".
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            dist/final/*
          fail_on_unmatched_files: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: needs.version.outputs.is_tag == 'true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: needs.version.outputs.is_tag == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Copies the manifest list images.yml already pushed for this exact commit (on its own push
      # to master) under a new tag, rather than rebuilding -- `imagetools create` only moves a
      # manifest, so this is seconds, not a second multi-platform build. Best-effort: it only
      # exists if images.yml already ran successfully for this SHA, which is the normal case for a
      # tag pushed against a commit already on master, but not guaranteed for one that is not.
      - name: Retag the node image with the release version
        if: needs.version.outputs.is_tag == 'true'
        continue-on-error: true
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/danpatten/stingstream-node:v${{ needs.version.outputs.version }} \
            ghcr.io/danpatten/stingstream-node:${{ github.sha }}

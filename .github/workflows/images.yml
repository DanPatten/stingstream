# The StingStream node image (M8a): deploy/node/Dockerfile, linux/amd64 + linux/arm64.
#
# A separate workflow from coordinator.yml on purpose: that one owns stingstream-coordinator (the
# stingstream-relay binary, `mesh/**` broadly) and is plausibly touched by the same milestone that
# is changing the coordinator itself; this one only cares about deploy/node/** and the three server
# subtrees' publishable projects. Keeping them apart means a node-image-only change does not queue
# behind, or race, an unrelated coordinator change in the same concurrency group.
#
#   * `build` (matrix: amd64, arm64) — each leg fetches ffmpeg/nzbget for its own platform, builds
#     the web bundle, and does a *single-platform* `docker buildx build`, pushed under its own
#     `:<sha>-<arch>` tag. **Not one multi-platform `buildx build` for both architectures at once**
#     -- that was tried first and blew through a 90-minute job timeout on a cold cache: QEMU-
#     emulating the arm64 leg's Rust-from-scratch compilation plus three self-contained .NET
#     publishes is slow enough that paying for it *and* the amd64 leg sequentially, in one job,
#     does not fit. Splitting them into their own matrix legs lets amd64 (native, fast) and arm64
#     (emulated, slow) run in parallel instead of one after the other, and gives each its own
#     timeout budget rather than sharing one.
#   * `manifest` — combines the two single-arch images into the one multi-platform manifest list
#     users actually pull (`docker buildx imagetools create`, which only copies references and
#     costs seconds, not a second build).
#   * A same-job smoke test on the amd64 leg only: `docker run` and `/healthz`, the same pattern
#     coordinator.yml's own `image` job uses -- a cross-arch image cannot be `docker run` directly
#     on a runner of the other architecture, and amd64 is the runner's own arch here.
name: images

on:
  push:
    branches: [master]
    paths:
      - "deploy/node/**"
      - "mesh/crates/stingstream/**"
      - "mesh/crates/stingstream-mesh/**"
      - "mesh/Cargo.toml"
      - "mesh/Cargo.lock"
      - "server/jellyfin/**"
      - "server/radarr/**"
      - "server/sonarr/**"
      - "third_party/ffmpeg/fetch-jellyfin-ffmpeg.ps1"
      - "third_party/nzbget/fetch-nzbget.ps1"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "deploy/node/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

concurrency:
  # Same reasoning as coordinator.yml and app.yml: on master every run gets its own group so a
  # push minutes behind another is never silently cancelled before it starts; on a branch a new
  # push supersedes the old run.
  group: images-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.run_id || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # A cold GHA cache still takes a while (the amd64 leg alone took ~19 minutes cold), but this
    # no longer has to also cover QEMU-emulated Rust-from-scratch: found for real that emulating
    # the arm64 leg on an x86_64 runner ran for the full previous 120-minute budget and was killed
    # by the timeout, not by anything actually wrong -- QEMU-emulated compilation of this much
    # Rust plus three self-contained .NET publishes just does not fit any sane budget. Fixed by
    # giving arm64 a genuinely native arm64 runner instead (see `runner:` in the matrix below) --
    # this repository is public, so GitHub's hosted `ubuntu-24.04-arm` runners are available at no
    # extra cost, and a native build needs no emulation at all.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      # third_party/*/fetch-*.ps1 use this to authenticate to api.github.com -- anonymous requests
      # share a 60/hour rate limit across every GitHub Actions runner's IP range, which several
      # concurrent workflows across this repo exhaust quickly; found failing for real, not
      # hypothetical (a jellyfin-ffmpeg fetch hit "API rate limit exceeded" mid-run).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            ffmpeg_platform: linux64
            fetch_nzbget: true
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            ffmpeg_platform: linuxarm64
            # No linux-arm64 nzbget asset upstream -- see deploy/node/LAYOUT.md. The Dockerfile's
            # `thirdparty` stage already handles a missing nzbget for this arch gracefully.
            fetch_nzbget: false
    steps:
      # submodules: true -- apps/stingstream/utils/jellyseerr is a real submodule and its
      # imports must resolve for bun run build:web below to bundle at all (same reasoning as
      # ci.yml's node job and app.yml's checks/android-release-unsigned jobs).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      # Cached keyed on the resolved release tag, not "latest" -- same pattern as release.yml's own
      # fetch steps. Each arch leg is its own runner (see the matrix's `runner:` field), so the
      # cache path/key doesn't need matrix.arch added on top of the platform token: linux64 and
      # linuxarm64 are already distinct.
      - name: Resolve jellyfin-ffmpeg version
        id: ffmpeg_version
        # -Platform matches the Fetch step below so the resolved (and cache-keyed) tag is
        # guaranteed to have the asset that step actually needs -- see the script's own
        # -PrintVersionOnly doc for why an unpinned platform can't make that guarantee.
        run: pwsh third_party/ffmpeg/fetch-jellyfin-ffmpeg.ps1 -PrintVersionOnly -Platform ${{ matrix.ffmpeg_platform }}

      - name: Cache jellyfin-ffmpeg
        id: cache_ffmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/ffmpeg/bin/${{ matrix.ffmpeg_platform }}
          key: jellyfin-ffmpeg-${{ steps.ffmpeg_version.outputs.tag }}-${{ matrix.ffmpeg_platform }}

      - name: Fetch jellyfin-ffmpeg (${{ matrix.ffmpeg_platform }})
        if: steps.cache_ffmpeg.outputs.cache-hit != 'true'
        run: pwsh third_party/ffmpeg/fetch-jellyfin-ffmpeg.ps1 -Platform ${{ matrix.ffmpeg_platform }} -Tag ${{ steps.ffmpeg_version.outputs.tag }}

      - name: Resolve nzbget version
        id: nzbget_version
        if: matrix.fetch_nzbget
        # -Platform matches the Fetch step below; see the ffmpeg Resolve step's own comment.
        run: pwsh third_party/nzbget/fetch-nzbget.ps1 -PrintVersionOnly -Platform linux-x64

      - name: Cache nzbget
        id: cache_nzbget
        if: matrix.fetch_nzbget
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/nzbget/bin/linux-x64
          key: nzbget-${{ steps.nzbget_version.outputs.tag }}-linux-x64

      - name: Fetch nzbget (linux-x64)
        if: matrix.fetch_nzbget && steps.cache_nzbget.outputs.cache-hit != 'true'
        run: pwsh third_party/nzbget/fetch-nzbget.ps1 -Platform linux-x64 -Tag ${{ steps.nzbget_version.outputs.tag }}

      # Found breaking the arm64 leg for real: deploy/node/Dockerfile's `thirdparty` stage does an
      # unconditional `COPY third_party/nzbget/bin /tp/nzbget`, and Docker's COPY fails hard --
      # "not found" -- on a source directory that does not exist at all, as opposed to one that is
      # merely empty. arm64 has no nzbget fetch step (no upstream release asset -- see
      # deploy/node/LAYOUT.md), so that directory was never created on this leg's checkout.
      - name: Ensure third_party/nzbget/bin exists even when nothing was fetched into it
        # A bare `mkdir -p` was not enough on its own -- found still failing after adding it:
        # Dockerfile.dockerignore's `!third_party/nzbget/bin/**` unignore pattern only matches
        # *files* under that path, so a truly empty directory never makes it into the build
        # context Docker actually sees, and COPY still reports "not found". The placeholder file
        # gives that pattern something to match; the Dockerfile's own arch-specific logic never
        # looks for a file named exactly this, so it changes nothing else.
        if: ${{ !matrix.fetch_nzbget }}
        run: |
          mkdir -p third_party/nzbget/bin
          touch third_party/nzbget/bin/.keep

      # The web bundle. Building it here (rather than shipping the image with only the placeholder
      # page) costs a few extra minutes of CI time for a release-quality image; a checkout with
      # no dist/ would otherwise fail the Dockerfile's COPY outright rather than degrading
      # gracefully, so this step is not optional. Built once per matrix leg -- the two legs run in
      # separate VMs and cannot share this output, but it is cheap next to the Docker build itself.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1

      # bun has no built-in cache action like actions/setup-node's `cache: npm` -- this caches
      # bun's own download cache (not node_modules, which `--frozen-lockfile` still reconstructs
      # every run) so a cache hit skips re-downloading every package bun.lock pins. Scoped per arch
      # since amd64 and arm64 are two separate runners here (matrix.arch), same reasoning as the
      # docker layer cache below.
      - name: Cache bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('apps/stingstream/bun.lock', 'packages/api-client/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ matrix.arch }}-
      - name: Install the API client's dependencies
        working-directory: packages/api-client
        run: bun install --frozen-lockfile
      - name: Build the web bundle
        working-directory: apps/stingstream
        run: |
          bun install --frozen-lockfile
          bun run build:web

      # No docker/setup-qemu-action: each leg now runs on a runner whose own architecture matches
      # its target platform (see the matrix's `runner:` field above), so this is always a native
      # build -- no emulation needed for either leg.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Single-platform, not `platforms: linux/amd64,linux/arm64` -- see this workflow's own header
      # for why. Tagged per-architecture; the `manifest` job below combines both into the one
      # multi-platform tag users actually pull.
      - name: Build and push (${{ matrix.platform }})
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/node/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
          tags: ghcr.io/danpatten/stingstream-node:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=node-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=node-image-${{ matrix.arch }}
          provenance: false

      # Smoke test only on the amd64 leg: it is the runner's own architecture, so the image it just
      # built can actually be `docker run`. Loaded locally rather than pushed a second time; reuses
      # the buildx cache from the step above, so this is fast next to the first build.
      - name: Build the smoke-test image (amd64 only)
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/node/Dockerfile
          platforms: linux/amd64
          load: true
          tags: stingstream-node-smoke:latest
          cache-from: type=gha,scope=node-image-amd64

      - name: Smoke-test the image (amd64 only)
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          docker run -d --name node-smoke -p 18790:8790 stingstream-node-smoke:latest

          # Five processes come up here, three of them self-contained .NET apps doing first-run
          # database setup -- a much heavier startup than coordinator.yml's single Rust binary, so
          # this accepts the gateway answering AT ALL (200 while healthy, 503 while a child is
          # still starting) as the pass condition within the window, rather than requiring every
          # child fully healthy -- that is what --healthcheck's own longer-run behaviour and a real
          # deploy's restart policy are for, not a CI smoke test's job.
          ok=0
          for i in $(seq 1 90); do
            code=$(curl -s -o /tmp/healthz.json -w '%{http_code}' http://127.0.0.1:18790/healthz || echo 000)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::/healthz never answered"
            docker logs node-smoke
            docker rm -f node-smoke
            exit 1
          fi
          cat /tmp/healthz.json
          echo
          # --healthcheck is the same check the image's own HEALTHCHECK runs; it only passes once
          # /healthz is actually 200, so give it its own longer, separate window rather than
          # failing the whole job over children that are still starting.
          for i in $(seq 1 60); do
            if docker exec node-smoke /app/bin/stingstream --healthcheck --data-dir /data; then break; fi
            sleep 2
          done
          docker logs node-smoke
          docker rm -f node-smoke

  manifest:
    name: publish multi-arch manifest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `imagetools create` only copies manifest references between tags that already exist in the
      # registry -- seconds, not a rebuild -- combining the two single-arch images the `build`
      # matrix just pushed into the one multi-platform tag a `docker pull` on either architecture
      # resolves correctly.
      - name: Combine into one multi-platform tag
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/danpatten/stingstream-node:${{ github.sha }} \
            --tag ghcr.io/danpatten/stingstream-node:latest \
            ghcr.io/danpatten/stingstream-node:${{ github.sha }}-amd64 \
            ghcr.io/danpatten/stingstream-node:${{ github.sha }}-arm64

  compose-smoke:
    name: compose smoke test (arbitrary UID, join-code secret)
    needs: build
    # Only where an image was actually pushed (a PR build never pushes -- see `build`'s own `push:`
    # condition) -- this job pulls the tag that step produces.
    if: needs.build.result == 'success' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # `docker compose config` renders and validates a file without starting anything -- the
      # fastest way to catch a Compose Specification mistake (a bad secrets: block, an
      # interpolation typo) before it reaches a real deploy. Every required env var gets a
      # plausible dummy value; join-code files point at /dev/null, the same soft default the
      # compose files themselves use.
      - name: Validate deploy/node/compose.yml
        run: |
          STINGSTREAM_JOIN_CODE_FILE=/dev/null \
            docker compose -f deploy/node/compose.yml config -q

      - name: Validate deploy/coordinator/compose.yml (storage-node profile)
        run: |
          COORDINATOR_HOSTNAME=coord.example.org \
          BASE_DOMAIN=example.org \
          PUBLIC_IPS=203.0.113.1 \
          ACME_CONTACT=admin@example.org \
          STORAGE_NODE_JOIN_CODE_FILE=/dev/null \
            docker compose -f deploy/coordinator/compose.yml --profile storage-node config -q

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the just-built amd64 image
        run: docker pull ghcr.io/danpatten/stingstream-node:${{ github.sha }}-amd64

      - name: Prepare fixtures for an arbitrary-UID run
        run: |
          mkdir -p /tmp/smoke-data /tmp/smoke-media
          # 777, deliberately, and only for this throwaway CI fixture: proving an *arbitrary*,
          # host-user-unrelated UID can write through a bind mount means the *host* side has to
          # allow it, exactly the situation deploy/coordinator/compose.yml's own `user:` comment
          # tells a real operator to solve by matching ownership instead.
          chmod 777 /tmp/smoke-data /tmp/smoke-media
          # Syntactically valid (non-empty) but not a real invite -- proves the secret-file ->
          # STINGSTREAM_JOIN_CODE_FILE -> joincode::resolve -> async join attempt -> /healthz
          # pipeline end-to-end without standing up a second coordinator+node in this job. A
          # malformed code decodes to JoinState::Failed immediately and is never retried
          # (mesh/crates/stingstream/src/joincode.rs), which is exactly what this test asserts on.
          echo "InvalidTestInviteCodeForCISmokeTestOnly123456789" > /tmp/smoke-join-code.txt
          chmod 644 /tmp/smoke-join-code.txt

      - name: Start the node under an arbitrary UID with a join-code secret
        run: |
          docker run -d --name node-uid-smoke \
            --user 1234:1234 \
            -p 18791:8790 \
            -v /tmp/smoke-data:/data \
            -v /tmp/smoke-media:/data/media \
            -v /tmp/smoke-join-code.txt:/run/secrets/join_code:ro \
            -e STINGSTREAM_JOIN_CODE_FILE=/run/secrets/join_code \
            ghcr.io/danpatten/stingstream-node:${{ github.sha }}-amd64

      # Up to 300s: the supervisor's own first-run health grace (deploy/node/Dockerfile's
      # HEALTHCHECK start-period, for the same reason) -- three self-contained .NET apps doing
      # first-run database setup, now also under a UID that owns nothing the image built with.
      - name: Wait up to 300s and assert healthy, with a join outcome on /healthz
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 150); do
            code=$(curl -s -o /tmp/healthz.json -w '%{http_code}' http://127.0.0.1:18791/healthz || echo 000)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          echo "-- /healthz --"
          cat /tmp/healthz.json 2>/dev/null || true
          echo
          echo "-- docker logs --"
          docker logs node-uid-smoke || true
          if [ "$ok" -ne 1 ]; then
            echo "::error::node under --user 1234:1234 never reported healthy (200) within 300s"
            docker rm -f node-uid-smoke || true
            exit 1
          fi
          python3 - <<'PYEOF'
          import json
          d = json.load(open("/tmp/healthz.json"))
          join = d.get("join")
          assert join is not None, "no 'join' field in /healthz -- the join-outcome reporting did not surface"
          assert join.get("state") == "failed", f"expected join.state == 'failed' for a malformed dummy code, got {join!r}"
          print("OK: join outcome surfaced on /healthz:", join)
          PYEOF
          docker rm -f node-uid-smoke

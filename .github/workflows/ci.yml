# Every `uses:` below is pinned to a commit SHA, with the version it corresponded to in a comment.
#
# A tag is a mutable pointer: `actions/checkout@v4` is whatever the `v4` tag points at *at the moment
# the job runs*, so anybody who gains push access to that repository can change what executes in this
# workflow without touching this file. That is not theoretical -- it is how the `tj-actions/changed-files`
# compromise reached tens of thousands of repositories in March 2025, by moving version tags onto a
# commit that printed runner memory into the build log. This workflow's runners hold no secrets on
# the pull-request path; the release workflow's do, and a habit that applies to only some workflows
# is not a habit.
#
# To update one: `gh api repos/<owner>/<repo>/git/ref/tags/vX --jq .object.sha`, put it here, and
# update the comment. Dependabot understands this form and will offer the bump.

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  dotnet:
    name: dotnet (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Points dotnet's own restore cache at a workspace-relative path so the "Cache NuGet
      # packages" step below actually caches what gets populated, rather than each matrix leg's
      # own per-OS default (~/.nuget/packages on Linux, %userprofile%\.nuget\packages on Windows).
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Each of the four .NET components pins its own SDK feature band via its own global.json
      # (jellyfin: 10.0.0, radarr: 8.0.421, sonarr: 10.0.400 -- re-vendored from v5-develop, which
      # pins .NET 10, not the v4/develop line's .NET 6; see docs/PATCHES.md) or bare net10.0 TFM
      # (infinidysk, no global.json). Installing these side-by-side is supported by the .NET SDK
      # and is the only way a single runner builds all four -- see docs/ARCHITECTURE.md "Facts"
      # for the M0 finding that no single locally-installed SDK version covers more than one.
      # Only Radarr still needs the 8.0 band; nothing needs 6.0 anymore.
      - name: Setup .NET SDKs (8.0, 9.0, 10.0)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # None of the four solutions has a packages.lock.json (docs/RELEASING.md's own "Caching"
      # section explains why one was not added in this pass), so the key is the next best thing:
      # every csproj plus each subtree's global.json and Directory.Packages.props -- anything that
      # changes what gets restored also changes this hash. restore-keys still gives a partial hit
      # (an older but mostly-compatible package set) if only one solution's dependencies moved.
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/jellyfin/global.json', 'server/radarr/global.json', 'server/sonarr/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Restored once per solution, then built with --no-restore, so a NuGet cache hit is a cache
      # hit for the build step too rather than dotnet re-checking (and potentially re-touching) the
      # package cache during an implicit restore-on-build.
      - name: Restore server/jellyfin (Jellyfin.Server)
        run: dotnet restore server/jellyfin/Jellyfin.sln

      - name: Build server/jellyfin (Jellyfin.Server)
        run: dotnet build server/jellyfin/Jellyfin.sln --configuration Release --no-restore

      # Only StingStream's own tests. Jellyfin's suite is upstream's and takes far longer than the
      # value it adds to a fork that does not touch most of what it covers; the four places
      # StingStream *does* patch are covered by the acceptance harnesses instead. These are the pure
      # functions where a mistake is silent: the path sanitiser (a security boundary -- peer titles
      # become folder names), the pointer-file naming Jellyfin's resolvers depend on, and the .nfo
      # dialect its parser reads.
      - name: Test StingStream.Core
        run: >
          dotnet test server/jellyfin/tests/StingStream.Core.Tests/StingStream.Core.Tests.csproj
          --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Restore server/radarr
        run: dotnet restore server/radarr/src/Radarr.sln

      - name: Build server/radarr
        run: dotnet build server/radarr/src/Radarr.sln --configuration Release --no-restore

      - name: Restore server/sonarr
        run: dotnet restore server/sonarr/src/Sonarr.sln

      - name: Build server/sonarr
        run: dotnet build server/sonarr/src/Sonarr.sln --configuration Release --no-restore

      - name: Restore server/infinidysk
        run: dotnet restore server/infinidysk/NzbWebDAV.sln

      - name: Build server/infinidysk
        run: dotnet build server/infinidysk/NzbWebDAV.sln --configuration Release --no-restore

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Deliberately NO `lfs: true`. mesh/jellyswarrm/dev/media/** is Git LFS-tracked upstream and
      # is vendored here as plain LFS *pointer* text -- the real objects were never pushed to this
      # repository's LFS endpoint, so an LFS-enabled checkout fails with "failed to fetch some
      # objects from .../info/lfs". The root .lfsconfig fetch-excludes that path for the same
      # reason, and nothing in this workflow needs the media: Jellyswarrm's demo fixtures are only
      # used by its own dev environment, which tools/fetch-jellyswarrm-media.ps1 sets up on demand.
      # See docs/PATCHES.md.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-05

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            mesh
            mesh/jellyswarrm
          # A red clippy/test run still leaves a perfectly good `target/` behind; without this the
          # next push on the same branch pays for a from-scratch rebuild just because the previous
          # run happened to fail a lint, which is the common case while iterating on a PR.
          cache-on-failure: true

      # mesh/ is deliberately TWO separate Cargo workspaces, not one -- re-rooting Jellyswarrm's
      # crates under mesh/Cargo.toml was tried during M0 and fails on its ~40-entry
      # workspace.dependencies table. See docs/ARCHITECTURE.md "Mesh workspace" and mesh/Cargo.toml.
      - name: Build mesh/ (stingstream, stingstream-mesh, stingstream-relay)
        run: cargo build --manifest-path mesh/Cargo.toml --workspace

      - name: Test mesh/
        run: cargo test --manifest-path mesh/Cargo.toml --workspace

      - name: Clippy mesh/
        run: cargo clippy --manifest-path mesh/Cargo.toml --workspace --all-targets -- -D warnings

      # crates/jellyswarrm-proxy has `#[derive(RustEmbed)] #[folder = "static/"]`, and that derive
      # only implements the Embed trait when the folder exists at compile time -- without it the
      # crate compiles Asset but omits get(), and every call site fails with "associated item not
      # found". The directory is not committed (git does not track empty directories, and it is
      # not part of the vendored source), so CI creates it. See docs/PATCHES.md.
      - name: Create the empty static/ directory jellyswarrm-proxy's RustEmbed derive needs
        run: mkdir -p mesh/jellyswarrm/crates/jellyswarrm-proxy/static
        shell: bash

      - name: Build mesh/jellyswarrm
        # JELLYSWARRM_SKIP_UI skips building the optional embedded jellyfin-web admin UI, whose
        # `ui/` git submodule a plain `git subtree add`/`pull` never initializes (see
        # docs/ARCHITECTURE.md). StingStream's own UI comes from apps/stingstream (Streamyfin), so
        # Jellyswarrm's bundled UI is not something we need built here.
        run: cargo build --manifest-path mesh/jellyswarrm/Cargo.toml --workspace
        env:
          JELLYSWARRM_SKIP_UI: "1"

  node:
    name: node (apps/stingstream)
    runs-on: ubuntu-latest
    steps:
      # submodules: true -- apps/stingstream/utils/jellyseerr is a real submodule (mapped in the
      # root .gitmodules, since `git subtree add` never initialized it: see docs/M2-web-spike.md
      # section 1) and its ~30 imports must resolve for the app to bundle at all. The two
      # `update = none` entries (mesh/jellyswarrm/ui, server/infinidysk/libs/rapidyenc) are skipped
      # cleanly here the same way they are for any other checkout in this repo -- verify that from
      # the run's checkout step log if this ever needs re-checking.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      # `expo export` is invoked via npx below (the command verified in docs/M2-web-spike.md),
      # which needs a real Node/npm on PATH regardless of bun.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      # Upstream Streamyfin uses bun (bun.lock committed), and it is the only package manager this
      # app supports: yarn's hoisting introduces a duplicate react-native-screens that crashes the
      # Android/TV app at startup (docs/M2-web-spike.md section 8; enforced for local installs too
      # via package.json's preinstall guard, see docs/APP-DEV.md).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1

      # bun has no built-in cache action like actions/setup-node's `cache: npm` -- this caches
      # bun's own download cache (not node_modules, which `--frozen-lockfile` still reconstructs
      # every run) so a cache hit skips re-downloading every package bun.lock pins.
      - name: Cache bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # packages/api-client is linked into the app as `file:../../packages/api-client`, and a
      # `file:` dependency's own dependencies are not hoisted into the app's node_modules -- so
      # `src/client.ts`'s `import createClient from "openapi-fetch"` resolves only if the package
      # has been installed in its own directory. Without this the app's Metro bundle fails with
      # "Unable to resolve module openapi-fetch from packages/api-client/src/client.ts", which is
      # what the node job did on master. It is first because the app's install must find it there.
      - name: Install api-client dependencies
        working-directory: packages/api-client
        run: bun install --frozen-lockfile

      - name: Install dependencies
        working-directory: apps/stingstream
        run: bun install --frozen-lockfile

      - name: Expo web export
        working-directory: apps/stingstream
        # The M2 web-target spike (docs/M2-web-spike.md) made this succeed for real: expo export
        # produces a working static bundle that boots, logs into Jellyfin, browses the library and
        # plays video. continue-on-error is gone on purpose -- a regression here should fail CI.
        run: npx expo export --platform web

      - name: Upload web export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stingstream-web-dist
          path: apps/stingstream/dist/
          if-no-files-found: error

  # The M1 acceptance harness: the test that decides whether a node actually works. It builds a
  # node, generates two test media files with the fetched jellyfin-ffmpeg, seeds them from a
  # self-hosted BitTorrent tracker, serves them from a Torznab stub, and drives a movie and an
  # episode all the way from a search to a playable stream out of Jellyfin -- then restarts the
  # node and checks everything comes back. See tools/e2e-m1.ps1 and docs/RUNNING.md.
  #
  # Linux-only: one runner is enough for an end-to-end test, and both fetch scripts support Linux.
  e2e-m1:
    name: e2e (M1 acceptance)
    runs-on: ubuntu-latest
    # Building Jellyfin, Radarr and Sonarr, then running the whole download path, takes a while.
    timeout-minutes: 60
    steps:
      # No `lfs: true`, for the reason in the rust job above.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET SDKs (8.0, 10.0)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-05

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: mesh
          cache-on-failure: true

      # Neither binary is vendored; both are fetched on demand into gitignored directories the
      # supervisor discovers on its own. Without ffmpeg the harness cannot generate its test files
      # and Jellyfin cannot probe them.
      # Cached keyed on the resolved release tag (not "latest"): the tag is what actually
      # determines the downloaded bytes, so a cache hit skips the download entirely rather than
      # just skipping a rebuild. -PrintVersionOnly makes one lightweight API call to resolve it;
      # -Tag on the real fetch below pins to that exact release rather than re-querying "latest" a
      # second time (and possibly getting a different answer than the version.json name implies).
      - name: Resolve jellyfin-ffmpeg version
        id: ffmpeg_version
        # -Platform matches the Fetch step below so the resolved (and cache-keyed) tag is
        # guaranteed to have the asset that step actually needs -- see the script's own
        # -PrintVersionOnly doc for why an unpinned platform can't make that guarantee.
        run: pwsh third_party/ffmpeg/fetch-jellyfin-ffmpeg.ps1 -PrintVersionOnly -Platform linux64
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache jellyfin-ffmpeg
        id: cache_ffmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/ffmpeg/bin/linux64
          key: jellyfin-ffmpeg-${{ steps.ffmpeg_version.outputs.tag }}-linux64

      - name: Fetch jellyfin-ffmpeg
        if: steps.cache_ffmpeg.outputs.cache-hit != 'true'
        run: pwsh third_party/ffmpeg/fetch-jellyfin-ffmpeg.ps1 -Platform linux64 -Tag ${{ steps.ffmpeg_version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Resolve nzbget version
        id: nzbget_version
        # -Platform matches the Fetch step below; see the ffmpeg Resolve step's own comment.
        run: pwsh third_party/nzbget/fetch-nzbget.ps1 -PrintVersionOnly -Platform linux-x64
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache nzbget
        id: cache_nzbget
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/nzbget/bin/linux-x64
          key: nzbget-${{ steps.nzbget_version.outputs.tag }}-linux-x64

      - name: Fetch NZBGet
        if: steps.cache_nzbget.outputs.cache-hit != 'true'
        run: pwsh third_party/nzbget/fetch-nzbget.ps1 -Platform linux-x64 -Tag ${{ steps.nzbget_version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build the supervisor
        run: cargo build --manifest-path mesh/Cargo.toml -p stingstream

      - name: Build Jellyfin (with StingStream.Core)
        run: dotnet build server/jellyfin/Jellyfin.Server/Jellyfin.Server.csproj -c Debug

      - name: Build Radarr
        run: dotnet build server/radarr/src/Radarr.sln -c Debug

      - name: Build Sonarr
        run: dotnet build server/sonarr/src/Sonarr.sln -c Debug

      - name: Build the harness support tools
        run: |
          dotnet build tools/seeder/Seeder.csproj -c Release
          dotnet build tools/torznab-stub/TorznabStub.csproj -c Release

      # Where the arrs actually put their entry points on this runner. They set a per-platform
      # RuntimeIdentifier, so the layout is not necessarily the one a Windows build produces, and
      # "no build output found" from the supervisor is otherwise a dead end.
      - name: Show where the builds landed
        if: always()
        run: |
          echo "--- radarr ---"
          find server/radarr -maxdepth 5 -name 'Radarr.Console*' -not -path '*/obj/*' | sort
          echo "--- sonarr ---"
          find server/sonarr -maxdepth 5 -name 'Sonarr.Console*' -not -path '*/obj/*' | sort
          echo "--- jellyfin ---"
          find server/jellyfin/Jellyfin.Server/bin -maxdepth 3 -name 'jellyfin*' | sort
          echo "--- nzbget ---"
          find third_party/nzbget/bin -maxdepth 4 \( -name 'nzbget' -o -name 'nzbget.conf.template' \) | sort

      # -WorkDir inside the workspace: the harness defaults to a directory beside the repository,
      # which keeps a whole node's data out of git status locally, but actions/upload-artifact
      # refuses any path outside $GITHUB_WORKSPACE.
      - name: Run the acceptance harness
        run: pwsh tools/e2e-m1.ps1 -SkipBuild -WorkDir "${{ github.workspace }}/.e2e-work"

      # The node's own logs are the only way to work out why a failure happened, and the run is
      # long enough that re-running it locally to find out is expensive. The arrs' own file logs
      # are included because that is where their import decisions live -- their console output,
      # which is what the supervisor captures, says nothing about a rejected import.
      - name: Upload node logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-m1-logs
          path: |
            .e2e-work/logs/
            .e2e-work/data/logs/
            .e2e-work/data/runtime.json
            .e2e-work/data/radarr/logs/
            .e2e-work/data/sonarr/logs/
          if-no-files-found: warn

  # The M3 acceptance harness: two complete nodes on one runner, a group with nothing hosted behind
  # it, and a peer's film playing out of the other node's own Jellyfin. Everything M1 does, plus the
  # invite, the gossiped index, the materialized Shared libraries, three playback paths and the
  # offline/online tagging. See tools/e2e-m3.ps1 and docs/RUNNING.md.
  #
  # -SkipCoordinator drops the two steps that talk to Dan's Railway coordinator. They work -- and
  # they are run by hand before a milestone is called done -- but they need the public internet and
  # they cost metered egress on his personal bill, which is not something every push should spend.
  # The zero-server steps are the ones that have to pass everywhere, and they need nothing but
  # loopback. The coordinator's own rendezvous-with-the-inviter-offline case is covered headlessly
  # by mesh/crates/stingstream-relay/tests/rendezvous_join.rs against a coordinator the test starts
  # itself, which runs in coordinator.yml.
  e2e-m3:
    name: e2e (M3 acceptance)
    runs-on: ubuntu-latest
    # Two nodes means two Jellyfins, two pairs of arrs and the whole download path once.
    timeout-minutes: 90
    steps:
      # No `lfs: true`, for the reason in the rust job above.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET SDKs (8.0, 10.0)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-05

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: mesh
          cache-on-failure: true

      # Cached keyed on the resolved release tag (not "latest"): the tag is what actually
      # determines the downloaded bytes, so a cache hit skips the download entirely rather than
      # just skipping a rebuild. -PrintVersionOnly makes one lightweight API call to resolve it;
      # -Tag on the real fetch below pins to that exact release rather than re-querying "latest" a
      # second time (and possibly getting a different answer than the version.json name implies).
      - name: Resolve jellyfin-ffmpeg version
        id: ffmpeg_version
        # -Platform matches the Fetch step below so the resolved (and cache-keyed) tag is
        # guaranteed to have the asset that step actually needs -- see the script's own
        # -PrintVersionOnly doc for why an unpinned platform can't make that guarantee.
        run: pwsh third_party/ffmpeg/fetch-jellyfin-ffmpeg.ps1 -PrintVersionOnly -Platform linux64
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache jellyfin-ffmpeg
        id: cache_ffmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/ffmpeg/bin/linux64
          key: jellyfin-ffmpeg-${{ steps.ffmpeg_version.outputs.tag }}-linux64

      - name: Fetch jellyfin-ffmpeg
        if: steps.cache_ffmpeg.outputs.cache-hit != 'true'
        run: pwsh third_party/ffmpeg/fetch-jellyfin-ffmpeg.ps1 -Platform linux64 -Tag ${{ steps.ffmpeg_version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Resolve nzbget version
        id: nzbget_version
        # -Platform matches the Fetch step below; see the ffmpeg Resolve step's own comment.
        run: pwsh third_party/nzbget/fetch-nzbget.ps1 -PrintVersionOnly -Platform linux-x64
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache nzbget
        id: cache_nzbget
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/nzbget/bin/linux-x64
          key: nzbget-${{ steps.nzbget_version.outputs.tag }}-linux-x64

      - name: Fetch NZBGet
        if: steps.cache_nzbget.outputs.cache-hit != 'true'
        run: pwsh third_party/nzbget/fetch-nzbget.ps1 -Platform linux-x64 -Tag ${{ steps.nzbget_version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The mesh binary as well as the supervisor: the supervisor embeds the mesh library, but the
      # harness's rendezvous scenario drives three standalone mesh nodes.
      - name: Build the supervisor and the mesh
        run: cargo build --manifest-path mesh/Cargo.toml -p stingstream -p stingstream-mesh

      - name: Build Jellyfin (with StingStream.Core)
        run: dotnet build server/jellyfin/Jellyfin.Server/Jellyfin.Server.csproj -c Debug

      - name: Build Radarr
        run: dotnet build server/radarr/src/Radarr.sln -c Debug

      - name: Build Sonarr
        run: dotnet build server/sonarr/src/Sonarr.sln -c Debug

      - name: Build the harness support tools
        run: |
          dotnet build tools/seeder/Seeder.csproj -c Release
          dotnet build tools/torznab-stub/TorznabStub.csproj -c Release

      - name: Run the M3 acceptance harness
        run: >
          pwsh tools/e2e-m3.ps1 -SkipBuild -SkipCoordinator
          -WorkDir "${{ github.workspace }}/.e2e-m3-work"

      # Both nodes' logs. Which node failed is usually obvious from the step name, but which node
      # *caused* it is not: a materialization that produced nothing is as likely to be B publishing
      # nothing as A reading nothing.
      - name: Upload node logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-m3-logs
          path: |
            .e2e-m3-work/logs/
            .e2e-m3-work/node-a/logs/
            .e2e-m3-work/node-b/logs/
            .e2e-m3-work/node-a/runtime.json
            .e2e-m3-work/node-b/runtime.json
            .e2e-m3-work/node-a/radarr/logs/
            .e2e-m3-work/node-b/radarr/logs/
            .e2e-m3-work/node-a/sonarr/logs/
            .e2e-m3-work/node-b/sonarr/logs/
          if-no-files-found: warn

      - name: Collect node A's federated tree
        if: always()
        run: |
          mkdir -p .e2e-m3-artifacts
          if [ -d .e2e-m3-work/node-a/federated ]; then
            find .e2e-m3-work/node-a/federated -type f -exec ls -l {} + > .e2e-m3-artifacts/federated-listing.txt
            # -print0, because every path here is a film title and every film title has spaces in
            # it. `for f in $(find ...)` splits "Version Probe" into two words, `cat` fails on the
            # first of them, and the step fails -- turning a *passing* acceptance run into a red
            # job with `cat: .../tv/Version: No such file or directory` as the only clue.
            find .e2e-m3-work/node-a/federated \( -name '*.strm' -o -name '*.nfo' \) -print0 |
              while IFS= read -r -d '' f; do
                echo "===== $f" >> .e2e-m3-artifacts/federated-pointers.txt
                cat "$f" >> .e2e-m3-artifacts/federated-pointers.txt
                echo >> .e2e-m3-artifacts/federated-pointers.txt
              done
          fi


      - name: Upload the federated listing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-m3-federated
          path: .e2e-m3-artifacts/
          if-no-files-found: warn

  # The M4 acceptance harness: three nodes, two encodes of one film, and a source choice that has to
  # be right. Lighter than the M3 job despite having one more node, because none of the three runs
  # an arr: B and C are pure holders whose media is placed on disk with an NFO carrying the TMDB id,
  # and A's only add is one the group already satisfies, which never reaches an arr at all. So this
  # job builds the supervisor and Jellyfin and nothing else, and needs no NZBGet, no seeder and no
  # Torznab stub.
  #
  # There is no -SkipCoordinator equivalent: every step here runs on loopback and needs nothing
  # hosted by anyone. See tools/e2e-m4.ps1 and docs/RUNNING.md.
  e2e-m4:
    name: e2e (M4 acceptance)
    runs-on: ubuntu-latest
    # Three Jellyfins, a 4K encode, and two throttled links that are throttled on purpose.
    timeout-minutes: 75
    steps:
      # No `lfs: true`, for the reason in the rust job above.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET SDK (10.0)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-05

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: mesh
          cache-on-failure: true

      # Both halves of this job need it: the harness generates the media with it, and node A
      # transcodes node C's 4K encode with it.
      # Same cache-by-resolved-tag pattern as e2e-m1/e2e-m3's own ffmpeg fetch; see that job's
      # comment.
      - name: Resolve jellyfin-ffmpeg version
        id: ffmpeg_version
        # -Platform matches the Fetch step below so the resolved (and cache-keyed) tag is
        # guaranteed to have the asset that step actually needs -- see the script's own
        # -PrintVersionOnly doc for why an unpinned platform can't make that guarantee.
        run: pwsh third_party/ffmpeg/fetch-jellyfin-ffmpeg.ps1 -PrintVersionOnly -Platform linux64
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache jellyfin-ffmpeg
        id: cache_ffmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/ffmpeg/bin/linux64
          key: jellyfin-ffmpeg-${{ steps.ffmpeg_version.outputs.tag }}-linux64

      - name: Fetch jellyfin-ffmpeg
        if: steps.cache_ffmpeg.outputs.cache-hit != 'true'
        run: pwsh third_party/ffmpeg/fetch-jellyfin-ffmpeg.ps1 -Platform linux64 -Tag ${{ steps.ffmpeg_version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build the supervisor
        run: cargo build --manifest-path mesh/Cargo.toml -p stingstream

      - name: Build Jellyfin (with StingStream.Core)
        run: dotnet build server/jellyfin/Jellyfin.Server/Jellyfin.Server.csproj -c Debug

      - name: Run the M4 acceptance harness
        run: >
          pwsh tools/e2e-m4.ps1 -SkipBuild
          -WorkDir "${{ github.workspace }}/.e2e-m4-work"

      # All three nodes' logs. Which node failed is usually obvious from the step name; which node
      # *caused* it is not, and the source-selection steps are decided by numbers that only appear
      # in A's mesh log.
      - name: Upload node logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-m4-logs
          path: |
            .e2e-m4-work/logs/
            .e2e-m4-work/node-a/logs/
            .e2e-m4-work/node-b/logs/
            .e2e-m4-work/node-c/logs/
            .e2e-m4-work/node-a/runtime.json
            .e2e-m4-work/node-b/runtime.json
            .e2e-m4-work/node-c/runtime.json
          if-no-files-found: warn

      - name: Collect node A's federated tree and pinned media
        if: always()
        run: |
          mkdir -p .e2e-m4-artifacts
          if [ -d .e2e-m4-work/node-a/federated ]; then
            find .e2e-m4-work/node-a/federated -type f -exec ls -l {} + > .e2e-m4-artifacts/federated-listing.txt
            # -print0: see the same step in the M3 job. Every path here is a film title, and every
            # film title has spaces in it.
            find .e2e-m4-work/node-a/federated -name '*.strm' -print0 |
              while IFS= read -r -d '' f; do
                echo "===== $f" >> .e2e-m4-artifacts/federated-pointers.txt
                cat "$f" >> .e2e-m4-artifacts/federated-pointers.txt
                echo >> .e2e-m4-artifacts/federated-pointers.txt
              done
          fi
          if [ -d .e2e-m4-work/node-a/media ]; then
            find .e2e-m4-work/node-a/media -type f -exec ls -l {} + > .e2e-m4-artifacts/pinned-listing.txt
          fi

      - name: Upload the federated listing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-m4-federated
          path: .e2e-m4-artifacts/
          if-no-files-found: warn

  # The M6 acceptance harness: a member with no indexers asks for a series, and somebody else's node
  # goes and gets it. Two nodes, but deliberately lopsided -- node A runs Jellyfin and the mesh only,
  # so its inability to fulfil anything is configuration rather than a mock, and node B runs both
  # arrs plus the Torznab stub and the seeder. That means the full download path once, not twice,
  # which is why this is lighter than the M3 job despite covering the same pipeline.
  #
  # No -SkipCoordinator equivalent is needed: every step runs on loopback and the group is created
  # with no coordinator at all. See tools/e2e-m6.ps1 and docs/REQUESTS.md.
  e2e-m6:
    name: e2e (M6 acceptance)
    runs-on: ubuntu-latest
    # Two Jellyfins, one arr pair, one real grab, and two twenty-second volunteer delays.
    timeout-minutes: 75
    steps:
      # No `lfs: true`, for the reason in the rust job above.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET SDKs (8.0, 10.0)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-05

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: mesh
          cache-on-failure: true

      # The harness generates both the episode it seeds and the film node B already holds.
      # Same cache-by-resolved-tag pattern as e2e-m1/e2e-m3's own ffmpeg fetch; see that job's
      # comment.
      - name: Resolve jellyfin-ffmpeg version
        id: ffmpeg_version
        # -Platform matches the Fetch step below so the resolved (and cache-keyed) tag is
        # guaranteed to have the asset that step actually needs -- see the script's own
        # -PrintVersionOnly doc for why an unpinned platform can't make that guarantee.
        run: pwsh third_party/ffmpeg/fetch-jellyfin-ffmpeg.ps1 -PrintVersionOnly -Platform linux64
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache jellyfin-ffmpeg
        id: cache_ffmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/ffmpeg/bin/linux64
          key: jellyfin-ffmpeg-${{ steps.ffmpeg_version.outputs.tag }}-linux64

      - name: Fetch jellyfin-ffmpeg
        if: steps.cache_ffmpeg.outputs.cache-hit != 'true'
        run: pwsh third_party/ffmpeg/fetch-jellyfin-ffmpeg.ps1 -Platform linux64 -Tag ${{ steps.ffmpeg_version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build the supervisor
        run: cargo build --manifest-path mesh/Cargo.toml -p stingstream

      - name: Build Jellyfin (with StingStream.Core)
        run: dotnet build server/jellyfin/Jellyfin.Server/Jellyfin.Server.csproj -c Debug

      # Only node B runs these, but both have to exist before either node starts.
      - name: Build Radarr
        run: dotnet build server/radarr/src/Radarr.sln -c Debug

      - name: Build Sonarr
        run: dotnet build server/sonarr/src/Sonarr.sln -c Debug

      - name: Build the harness support tools
        run: |
          dotnet build tools/seeder/Seeder.csproj -c Release
          dotnet build tools/torznab-stub/TorznabStub.csproj -c Release

      - name: Run the M6 acceptance harness
        run: >
          pwsh tools/e2e-m6.ps1 -SkipBuild
          -WorkDir "${{ github.workspace }}/.e2e-m6-work"

      # Both nodes' logs. A failing claim step is decided by lines that appear in *both* -- A's
      # mesh log says what it published, B's says what it claimed -- and reading only one of them
      # cannot tell "nobody claimed" from "the claim never arrived".
      - name: Upload node logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-m6-logs
          path: |
            .e2e-m6-work/logs/
            .e2e-m6-work/node-a/logs/
            .e2e-m6-work/node-b/logs/
            .e2e-m6-work/node-a/runtime.json
            .e2e-m6-work/node-b/runtime.json
          if-no-files-found: warn

      # The request rows and the claims, straight out of both databases. When a request is stuck the
      # question is always "which node thinks it owns this", and the answer is two tables.
      - name: Collect the request tables
        if: always()
        run: |
          mkdir -p .e2e-m6-artifacts
          sudo apt-get install -y --no-install-recommends sqlite3 >/dev/null 2>&1 || true
          for node in a b; do
            core=".e2e-m6-work/node-$node/core.db"
            mesh=".e2e-m6-work/node-$node/mesh.db"
            if [ -f "$core" ]; then
              {
                echo "===== node-$node core.db requests"
                sqlite3 -header -column "$core" \
                  'SELECT id, kind, item_key, state, mine, fulfilling_node_name, note FROM requests;' || true
                echo
                echo "===== node-$node core.db notifications"
                sqlite3 -header -column "$core" \
                  'SELECT id, kind, title, read FROM notifications;' || true
              } >> .e2e-m6-artifacts/requests.txt
            fi
            if [ -f "$mesh" ]; then
              {
                echo "===== node-$node mesh.db request_claims"
                sqlite3 -header -column "$mesh" \
                  'SELECT request_id, node_name, claimed_at, state, note FROM request_claims;' || true
              } >> .e2e-m6-artifacts/claims.txt
            fi
          done

      - name: Upload the request tables
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-m6-requests
          path: .e2e-m6-artifacts/
          if-no-files-found: warn

  # The M7 acceptance harness: watch together across nodes, subtitles that travel with a title, DVR
  # recordings that federate, and the two bugs M5 handed on.
  #
  # Three nodes, no arrs and no NZBGet -- B and C are pure holders whose media is placed on disk
  # with an NFO carrying the TMDB id, and nothing here grabs anything -- so like the M4 job this
  # builds the supervisor and Jellyfin and nothing else.
  #
  # The subtitle provider is deliberately mocked: the sidecar is written onto the holder's disk, and
  # what the run asserts is the publish-and-fetch half. A job that depended on OpenSubtitles
  # answering would go red for reasons that have nothing to do with this repository.
  #
  # See tools/e2e-m7.ps1 and docs/RUNNING.md.
  e2e-m7:
    name: e2e (M7 acceptance)
    runs-on: ubuntu-latest
    # Three Jellyfins, and a watch-together sequence that waits for real settling time between
    # commands rather than asserting on an instant that has not arrived yet.
    timeout-minutes: 75
    steps:
      # No `lfs: true`, for the reason in the rust job above.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET SDK (10.0)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-05

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: mesh
          cache-on-failure: true

      # The harness generates its clips with it, and Jellyfin needs it to probe them.
      # Same cache-by-resolved-tag pattern as e2e-m1/e2e-m3's own ffmpeg fetch; see that job's
      # comment.
      - name: Resolve jellyfin-ffmpeg version
        id: ffmpeg_version
        # -Platform matches the Fetch step below so the resolved (and cache-keyed) tag is
        # guaranteed to have the asset that step actually needs -- see the script's own
        # -PrintVersionOnly doc for why an unpinned platform can't make that guarantee.
        run: pwsh third_party/ffmpeg/fetch-jellyfin-ffmpeg.ps1 -PrintVersionOnly -Platform linux64
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache jellyfin-ffmpeg
        id: cache_ffmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/ffmpeg/bin/linux64
          key: jellyfin-ffmpeg-${{ steps.ffmpeg_version.outputs.tag }}-linux64

      - name: Fetch jellyfin-ffmpeg
        if: steps.cache_ffmpeg.outputs.cache-hit != 'true'
        run: pwsh third_party/ffmpeg/fetch-jellyfin-ffmpeg.ps1 -Platform linux64 -Tag ${{ steps.ffmpeg_version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build the supervisor
        run: cargo build --manifest-path mesh/Cargo.toml -p stingstream

      - name: Build Jellyfin (with StingStream.Core)
        run: dotnet build server/jellyfin/Jellyfin.Server/Jellyfin.Server.csproj -c Debug

      - name: Run the M7 acceptance harness
        run: >
          pwsh tools/e2e-m7.ps1 -SkipBuild
          -WorkDir "${{ github.workspace }}/.e2e-m7-work"

      # All three nodes' logs. The watch-together steps are decided by numbers that appear only in
      # A's and B's mesh logs -- the scheduled play-at instant, the measured round trip, and the
      # drift each report carried.
      - name: Upload node logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-m7-logs
          path: |
            .e2e-m7-work/logs/
            .e2e-m7-work/node-a/logs/
            .e2e-m7-work/node-b/logs/
            .e2e-m7-work/node-c/logs/
            .e2e-m7-work/node-a/runtime.json
            .e2e-m7-work/node-b/runtime.json
            .e2e-m7-work/node-c/runtime.json
          if-no-files-found: warn

      # What A materialized: the pointers, the subtitle sidecars beside them, and the Shared
      # Recordings tree. A failure in the subtitle or recording steps is nearly always visible in
      # this listing alone -- a missing `.srt`, or a `.strm` in the wrong library.
      - name: Collect node A's federated tree
        if: always()
        run: |
          mkdir -p .e2e-m7-artifacts
          if [ -d .e2e-m7-work/node-a/federated ]; then
            find .e2e-m7-work/node-a/federated -type f -exec ls -l {} + > .e2e-m7-artifacts/federated-listing.txt
            # -print0, because every path here is a film title and every film title has spaces in
            # it. See the M3 job for the afternoon that taught us.
            find .e2e-m7-work/node-a/federated \( -name '*.strm' -o -name '*.srt' \) -print0 |
              while IFS= read -r -d '' f; do
                echo "===== $f" >> .e2e-m7-artifacts/federated-pointers.txt
                cat "$f" >> .e2e-m7-artifacts/federated-pointers.txt
                echo >> .e2e-m7-artifacts/federated-pointers.txt
              done
          fi

      - name: Upload the federated listing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-m7-federated
          path: .e2e-m7-artifacts/
          if-no-files-found: warn

  e2e-m8:
    name: e2e (M8b acceptance)
    runs-on: ubuntu-latest
    # Four mesh nodes and no Jellyfin at all, so this is the cheapest of the acceptance jobs. The
    # budget is mostly the two cargo test runs it does before it starts anything.
    timeout-minutes: 30
    steps:
      # No `lfs: true`, for the reason in the rust job above.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-05

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: mesh
          cache-on-failure: true

      # No ffmpeg and no .NET: revocation is entirely a mesh concern, and the harness makes its
      # "media" with `dd`-shaped zero bytes because nothing here plays anything.
      - name: Build the mesh binary
        run: cargo build --manifest-path mesh/Cargo.toml -p stingstream-mesh

      - name: Run the M8b acceptance harness
        run: >
          pwsh tools/e2e-m8.ps1 -SkipBuild
          -WorkDir "${{ github.workspace }}/.e2e-m8-work"

      # Every assertion in this harness is about what one node did or refused to do, and the
      # refusals are only visible in the node's own log -- a failed handshake, a rejected rotation,
      # a frame dropped for its protocol version.
      - name: Upload node logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-m8-logs
          path: .e2e-m8-work/logs/
          if-no-files-found: warn

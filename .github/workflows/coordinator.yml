# The mesh half of M3: `stingstream-mesh` and `stingstream-relay`.
#
# Deliberately a separate workflow from ci.yml, which builds the .NET subtrees and the Expo app and
# takes the best part of an hour. This one runs in minutes and is what a mesh change waits on.
#
#   * `test`   — unit tests, the two-node integration test and clippy, on Linux and Windows.
#   * `nat`    — two nodes behind separate NATted Docker networks, with a coordinator in Full mode
#                as the relay. Runs the same join-and-stream path over a real NAT, then again with
#                UDP blocked so the connection has to fall back to the relay on TCP.
#   * `sidedoor` — the HTTPS side door end to end against a local Pebble: a real ACME order, a real
#                certificate, a real TLS handshake and a real tunnel through the SNI router.
#   * `image`  — builds the coordinator image, and publishes it to GHCR on master.
name: coordinator

on:
  push:
    branches: [master]
    paths:
      - "mesh/**"
      - "deploy/coordinator/**"
      - ".github/workflows/coordinator.yml"
  pull_request:
    paths:
      - "mesh/**"
      - "deploy/coordinator/**"
      - ".github/workflows/coordinator.yml"
  workflow_dispatch:

concurrency:
  group: coordinator-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The mesh's own tests are chatty at debug and silent at warn; info is the level that makes a CI
  # failure diagnosable from the log alone.
  RUST_LOG: stingstream_mesh=info,stingstream_relay=info,warn

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # No `lfs: true`: mesh/jellyswarrm/dev/media/** is vendored as LFS pointer text whose objects
      # were never pushed to this repository, so an LFS checkout fails. Same reason as ci.yml.
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mesh

      - name: Build
        run: cargo build --manifest-path mesh/Cargo.toml -p stingstream-mesh -p stingstream-relay

      - name: Clippy
        run: >
          cargo clippy --manifest-path mesh/Cargo.toml
          -p stingstream-mesh -p stingstream-relay --all-targets -- -D warnings

      # The integration tests bring up real iroh endpoints. They are configured with every
      # discovery service off (no n0 relays, no n0 DNS, no mainline DHT), so they need no network
      # beyond loopback and cannot be made flaky by someone else's infrastructure.
      - name: Test
        run: cargo test --manifest-path mesh/Cargo.toml -p stingstream-mesh -p stingstream-relay

  nat:
    name: NAT scenario (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mesh

      - name: Build the mesh and coordinator binaries
        run: >
          cargo build --release --manifest-path mesh/Cargo.toml
          -p stingstream-mesh -p stingstream-relay

      - name: Run the NAT scenario
        run: bash mesh/tests/nat/run.sh
        env:
          MESH_BIN: ${{ github.workspace }}/mesh/target/release/stingstream-mesh
          RELAY_BIN: ${{ github.workspace }}/mesh/target/release/stingstream-relay

      - name: Upload the scenario logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nat-scenario-logs
          # Only the logs. The scenario's data directories also hold each node's `mesh.db`, which
          # is created inside the container as root and mode 0600 for the same reason `node.key`
          # is — the runner user cannot read it, and the upload fails on the whole directory.
          path: |
            /tmp/stingstream-nat/*.log
            /tmp/stingstream-nat/*/*.log
          if-no-files-found: warn

  sidedoor:
    name: HTTPS side door (Pebble)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mesh

      # Pebble is fetched by the harness itself (binary + the three test certificates its HTTPS
      # listener needs) into third_party/pebble/bin. Caching it turns a GitHub download into a
      # cache hit; a miss just fetches again, so this is an optimisation and not a dependency.
      - name: Cache Pebble
        uses: actions/cache@v4
        with:
          path: third_party/pebble/bin
          key: pebble-v2.10.1-${{ runner.os }}

      # `pwsh` is preinstalled on the GitHub ubuntu image and is the same shell Dan runs locally,
      # so the harness has one code path rather than two.
      - name: Run the side-door acceptance
        run: pwsh tools/e2e-sidedoor.ps1
        env:
          RUST_LOG: stingstream=info,stingstream_mesh=info,stingstream_relay=info,warn

      - name: Upload the side-door logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidedoor-logs
          path: /tmp/stingstream-sidedoor/logs/*.log
          if-no-files-found: warn

  image:
    name: coordinator image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Only master publishes. A pull request still builds the image, which is the half of this
      # job that catches a broken Dockerfile.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/coordinator/Dockerfile
          push: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
          # Lowercase on purpose: GHCR rejects an uppercase path, and the owner is `DanPatten`.
          tags: |
            ghcr.io/danpatten/stingstream-coordinator:${{ github.sha }}
            ghcr.io/danpatten/stingstream-coordinator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # A built image that cannot answer /healthz is not a passing build. This runs the freshly
      # built image (from the local buildx cache on a PR, from the registry on master) and checks
      # the one endpoint every deployment target polls.
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker build -f deploy/coordinator/Dockerfile -t coordinator-smoke .
          docker run -d --name coordinator-smoke -p 18080:8080 coordinator-smoke --mode lite
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz > /tmp/healthz.json; then break; fi
            sleep 1
          done
          cat /tmp/healthz.json
          grep -q '"ok":true' /tmp/healthz.json
          grep -q '"mode":"lite"' /tmp/healthz.json
          docker logs coordinator-smoke
          docker rm -f coordinator-smoke

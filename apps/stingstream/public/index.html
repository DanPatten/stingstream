<!DOCTYPE html>
<!--
  The web shell for `web.output: "single"`. Expo uses this file as its HTML template when
  it exists, substitutes the placeholders and appends its scripts at the end of the head. It is a
  verbatim copy of Expo's own template plus the icon links below; diff it against
  node_modules/@expo/cli/static/template/index.html after an SDK bump.
  Why it exists rather than app/+html.tsx: docs/APP-RELEASE.md §3 "Branding".

  Do not write a literal closing-head or opening-head tag in this comment. The gateway splices the
  node marker into the head at serve time (mesh/crates/stingstream/src/gateway/web.rs), and a tag
  spelled out here once made it splice into this comment instead -- so every page a node served
  told the app it was not a node, and the app asked for a server address at the machine it was
  already talking to. `inject` no longer scans for the closing tag and skips comments, so this is
  belt and braces; it costs nothing to keep.
-->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- Brand icons, all written by `bun scripts/brand/generate.ts` into public/. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>

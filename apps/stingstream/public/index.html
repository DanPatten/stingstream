<!DOCTYPE html>
<!--
  The web shell for `web.output: "single"`. Expo uses this file as its HTML template when
  it exists, substitutes the placeholders and appends its scripts at the end of the head. It is a
  verbatim copy of Expo's own template plus the icon links below; diff it against
  node_modules/@expo/cli/static/template/index.html after an SDK bump.
  Why it exists rather than app/+html.tsx: docs/APP-RELEASE.md §3 "Branding".

  Do not write a literal closing-head or opening-head tag in this comment. The gateway splices the
  node marker into the head at serve time (mesh/crates/stingstream/src/gateway/web.rs), and a tag
  spelled out here once made it splice into this comment instead -- so every page a node served
  told the app it was not a node, and the app asked for a server address at the machine it was
  already talking to. `inject` no longer scans for the closing tag and skips comments, so this is
  belt and braces; it costs nothing to keep.
-->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!--
      No focus ring is ever drawn outside the control it belongs to.

      A CSS outline is painted outside the border box, so every ancestor that clips cuts it off:
      a horizontal ScrollView is `overflow-y: hidden` on web, which shears the ring flat along the
      top of every chip bar and tab strip, and a rounded card with `overflow: hidden` around a
      full-bleed row swallows it whole. The app's own ring is drawn inside the control for exactly
      that reason (`constants/theme.ts`, `webFocusRing`); this is the same rule for the controls
      that still fall back to the browser's default outline -- a plain link, a `<Switch>`'s
      checkbox, a Pressable that has not been moved onto `usePressableStates` yet.

      `solid`, not the browser's `auto`: Chrome clamps a negative `outline-offset` to zero on an
      `auto` outline, so the offset alone was silently ignored on exactly the elements it was
      written for. `currentColor` because this rule cannot know the theme -- but a control's own
      text colour is already chosen to be legible on the surface behind it, so it is always a ring
      that can be seen.

      react-native-web injects its own stylesheet after this one and the app's ring is an atomic
      class in it, so a control that styles itself keeps its own accent ring and this stays the
      fallback it is meant to be.
    -->
    <style id="focus-ring-inset">
      :focus-visible {
        outline: 2px solid currentColor;
        outline-offset: -2px;
      }
    </style>

    <!-- Brand icons, all written by `bun scripts/brand/generate.ts` into public/. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>

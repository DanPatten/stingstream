[package]
name = "stingstream-accounts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "StingStream accounts: who you are, which servers are yours, and who you have shared with. Holds no media. See docs/ACCOUNTS.md."

[lib]
name = "stingstream_accounts"
path = "src/lib.rs"

[[bin]]
name = "stingstream-accounts"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Password hashing. `password-hash` gives the PHC string format, so the parameters travel with the
# hash and a later change to them does not invalidate what is already stored.
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
# The node's identity is an iroh key, and this service's whole door policy is "prove you are that
# node". `iroh-base` is the key type on its own, without dragging in the endpoint or the relay.
iroh-base = { version = "1.1", features = ["key"] }
password-hash = { version = "0.5", features = ["rand_core"] }
rand = "0.8"
# SQLite rather than Postgres: same store the mesh already uses, so the patterns and the test
# helpers are the ones in `stingstream-mesh/src/db.rs`, and a test opens one in memory instead of
# needing a server. See `db.rs` for the durability trade this makes.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stingstream-token = { path = "../stingstream-token" }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
iroh = "1.1"
tempfile = "3"

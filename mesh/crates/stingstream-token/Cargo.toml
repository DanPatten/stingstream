[package]
name = "stingstream-token"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The signed token the account service issues and every StingStream server verifies offline."

[lib]
name = "stingstream_token"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
data-encoding = "2"
iroh-base = { version = "1.1", features = ["key"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

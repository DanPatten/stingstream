[package]
name = "stingstream"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "StingStream entry binary: supervisor + gateway. See docs/ARCHITECTURE.md."

[[bin]]
name = "stingstream"
path = "src/main.rs"

[lib]
name = "stingstream"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
data-encoding = "2"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio", "service"] }
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
iroh = "1.1"
portmapper = "0.19"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
x509-parser = "0.18"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
stingstream-mesh = { path = "../stingstream-mesh" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "net", "signal", "sync", "time"] }
toml = "0.8"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# --service (M8a): a proper Windows service via the SCM, rather than a generic wrapper (NSSM et
# al.) that can only hard-kill the process it launched. See src/service.rs.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[dev-dependencies]
tempfile = "3"
